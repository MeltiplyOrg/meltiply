# Continuation pipeline, produced by .circleci/config.yml after path filtering.
#
# Automatic pipelines use small/medium Docker jobs for deterministic checks.
# Docker Compose, browser journeys, and k6 use an isolated Linux VM only when a
# contributor explicitly selects their manual workflow.  No job relies on
# runner-local state or a persistent runner.
version: 2.1

retention:
  caches: 7d

parameters:
  # Set by the setup pipeline's path filtering, through the continuation payload.
  run-frontend:
    type: boolean
    default: false
  run-cloudflare:
    type: boolean
    default: false
  # Manual trigger flags. CircleCI forwards pipeline parameters supplied at
  # trigger time to the continuation config as well, so they must be declared
  # here under the same names the setup config exposes, or compilation fails
  # with "Unexpected argument(s)". The setup job must NOT also send them in the
  # continuation payload; doing so reports conflicting pipeline parameters.
  frontend-full:
    type: boolean
    default: false
  cloudflare-integration:
    type: boolean
    default: false
  cloudflare-extended:
    type: boolean
    default: false
  staging-release:
    type: boolean
    default: false

executors:
  node-small:
    docker:
      - image: cimg/node:24.18.0
    resource_class: small
    working_directory: ~/project
  node-medium:
    docker:
      - image: cimg/node:24.18.0
    resource_class: medium
    working_directory: ~/project
  # Release stages use the medium Docker class; the alias keeps their existing
  # protected job definitions concise.
  node:
    docker:
      - image: cimg/node:24.18.0
    resource_class: medium
    working_directory: ~/project
  linux-medium:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project

commands:
  local-checkout:
    steps:
      - checkout
      - run:
          name: Verify checkout commit
          command: |
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}"

  install-bun:
    steps:
      - restore_cache:
          keys:
            - v1-bun-binary-{{ arch }}-{{ checksum "package.json" }}
      - run:
          name: Install pinned Bun
          command: |
            set -euo pipefail
            version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
            export BUN_INSTALL="$HOME/.bun"
            if [[ ! -x "$BUN_INSTALL/bin/bun" ]] || [[ "$("$BUN_INSTALL/bin/bun" --version)" != "$version" ]]; then
              curl -fsSL https://bun.sh/install | bash -s "bun-v$version"
            fi
            test "$("$BUN_INSTALL/bin/bun" --version)" = "$version"
            echo "export PATH=$BUN_INSTALL/bin:\$PATH" >>"$BASH_ENV"
      - save_cache:
          key: v1-bun-binary-{{ arch }}-{{ checksum "package.json" }}
          paths:
            - ~/.bun/bin

  install-workspace:
    steps:
      - install-bun
      - restore_cache:
          keys:
            - v1-bun-docker-{{ arch }}-{{ checksum "package.json" }}-{{ checksum "bunfig.toml" }}-{{ checksum "bun.lock" }}
      - run:
          name: Install workspace dependencies
          command: |
            set -euo pipefail
            test -f bun.lock
            bun install --frozen-lockfile
      - save_cache:
          key: v1-bun-docker-{{ arch }}-{{ checksum "package.json" }}-{{ checksum "bunfig.toml" }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

  install-target-workspace:
    steps:
      - install-bun
      - restore_cache:
          keys:
            - v1-bun-docker-{{ arch }}-{{ checksum "package.json" }}-{{ checksum "bunfig.toml" }}-{{ checksum "bun.lock" }}
      - run:
          name: Install release workspace without lifecycle scripts
          command: |
            set -euo pipefail
            test -f bun.lock
            bun install --ignore-scripts --frozen-lockfile
      - save_cache:
          key: v1-bun-docker-{{ arch }}-{{ checksum "package.json" }}-{{ checksum "bunfig.toml" }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

  install-machine-workspace:
    steps:
      - install-bun
      - restore_cache:
          keys:
            - v1-bun-machine-{{ arch }}-{{ checksum "package.json" }}-{{ checksum "bunfig.toml" }}-{{ checksum "bun.lock" }}
      - run:
          name: Install workspace dependencies
          command: |
            set -euo pipefail
            test -f bun.lock
            bun install --frozen-lockfile
      - save_cache:
          key: v1-bun-machine-{{ arch }}-{{ checksum "package.json" }}-{{ checksum "bunfig.toml" }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

  install-gitleaks:
    steps:
      - restore_cache:
          keys:
            - v1-gitleaks-binary-8.30.1-{{ arch }}
      - run:
          name: Install pinned gitleaks
          command: |
            set -euo pipefail
            version=8.30.1
            bin_dir="$HOME/.local/bin"
            mkdir -p "$bin_dir"
            echo "export PATH=$bin_dir:\$PATH" >> "$BASH_ENV"
            if [[ -x "$bin_dir/gitleaks" ]] && [[ "$("$bin_dir/gitleaks" version 2>/dev/null || true)" == *"$version"* ]]; then
              exit 0
            fi
            case "$(uname -m)" in
              x86_64 | amd64) arch=x64 ;;
              aarch64 | arm64) arch=arm64 ;;
              *) echo "Unsupported gitleaks architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_${arch}.tar.gz" \
              | tar -xz -C "$bin_dir" gitleaks
            "$bin_dir/gitleaks" version
      - save_cache:
          key: v1-gitleaks-binary-8.30.1-{{ arch }}
          paths:
            - ~/.local/bin/gitleaks

  install-typos:
    steps:
      - restore_cache:
          keys:
            - v1-typos-binary-1.35.5-{{ arch }}
      - run:
          name: Install pinned typos
          command: |
            set -euo pipefail
            version=1.35.5
            bin_dir="$HOME/.local/bin"
            mkdir -p "$bin_dir"
            echo "export PATH=$bin_dir:\$PATH" >> "$BASH_ENV"
            if [[ -x "$bin_dir/typos" ]] && [[ "$("$bin_dir/typos" --version 2>/dev/null || true)" == *"$version"* ]]; then
              exit 0
            fi
            case "$(uname -m)" in
              x86_64 | amd64) arch=x86_64-unknown-linux-musl ;;
              aarch64 | arm64) arch=aarch64-unknown-linux-musl ;;
              *) echo "Unsupported typos architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL "https://github.com/crate-ci/typos/releases/download/v${version}/typos-v${version}-${arch}.tar.gz" \
              | tar -xz -C "$bin_dir" ./typos
            "$bin_dir/typos" --version
      - save_cache:
          key: v1-typos-binary-1.35.5-{{ arch }}
          paths:
            - ~/.local/bin/typos

  install-oasdiff:
    steps:
      - restore_cache:
          keys:
            - v1-oasdiff-binary-1.17.0-{{ arch }}
      - run:
          name: Install pinned oasdiff
          command: |
            set -euo pipefail
            version=1.17.0
            bin_dir="$HOME/.local/bin"
            mkdir -p "$bin_dir"
            echo "export PATH=$bin_dir:\$PATH" >> "$BASH_ENV"
            echo "export OASDIFF_BIN=$bin_dir/oasdiff" >> "$BASH_ENV"
            if [[ -x "$bin_dir/oasdiff" ]] && [[ "$("$bin_dir/oasdiff" --version 2>/dev/null || true)" == *"$version"* ]]; then
              exit 0
            fi
            case "$(uname -m)" in
              x86_64 | amd64) arch=amd64 ;;
              aarch64 | arm64) arch=arm64 ;;
              *) echo "Unsupported oasdiff architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${version}/oasdiff_${version}_linux_${arch}.tar.gz" \
              | tar -xz -C "$bin_dir" oasdiff
            "$bin_dir/oasdiff" --version
      - save_cache:
          key: v1-oasdiff-binary-1.17.0-{{ arch }}
          paths:
            - ~/.local/bin/oasdiff

  install-opentofu:
    steps:
      - restore_cache:
          keys:
            - v1-opentofu-binary-{{ arch }}-{{ checksum "scripts/infra/install-opentofu.sh" }}
      - run:
          name: Install pinned OpenTofu
          command: ./scripts/infra/install-opentofu.sh
      - save_cache:
          key: v1-opentofu-binary-{{ arch }}-{{ checksum "scripts/infra/install-opentofu.sh" }}
          paths:
            - .bin/tofu

  cancel-sibling-workflows:
    steps:
      - run:
          name: Cancel active sibling workflows on failure
          when: on_fail
          command: ./scripts/ci/cancel-siblings-on-failure.sh

jobs:
  baseline:
    executor: node-small
    steps:
      - local-checkout
      - install-gitleaks
      - run:
          name: Cancel superseded pipelines of this branch
          command: ./scripts/ci/cancel-superseded.sh
      - run:
          name: Scan tracked content and history for secrets
          command: ./scripts/ci/gitleaks-check.sh
      - run:
          name: Check documentation links
          command: |
            node --test scripts/ci/docs-links.test.mjs
            node scripts/ci/docs-links.mjs
      - cancel-sibling-workflows

  ci-gate:
    executor: node-small
    steps:
      - local-checkout
      - run:
          name: Confirm quality gate
          command: echo "Authoritative quality checks completed successfully."
      - cancel-sibling-workflows

  frontend-fast:
    executor: node-medium
    steps:
      - local-checkout
      - install-workspace
      - run:
          name: Format, type, bindings, lint, unit tests, and build
          command: |
            bun run --cwd frontend/app format-check
            bun run --cwd frontend/app type-check
            bun run --cwd frontend/app cf-typegen:check
            bun run --cwd frontend/app lint
            bun run --cwd frontend/app test --coverage
            bun run --cwd frontend/app build:production
            bun run --cwd frontend/public check
      - cancel-sibling-workflows

  cloudflare-fast:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - local-checkout
      - install-machine-workspace
      - run:
          name: Start containerized PostgreSQL test database
          command: ./scripts/cloudflare-local/compose.sh up -d postgres
      - install-typos
      - run:
          name: Check spelling
          command: typos --config .typos.toml
      - run:
          name: Validate contract, Worker types, and generated bindings
          command: |
            set -euo pipefail
            bun run contract:check
            bun run workers:types
            git diff --exit-code -- workers/api/worker-configuration.d.ts workers/automation/worker-configuration.d.ts workers/state/worker-configuration.d.ts
      # Vite+ writes content-addressed task results to node_modules/.vite;
      # archive keys land under bun.lock so successful tasks accumulate across
      # branch revisions while a dependency change cleanly resets the store.
      - restore_cache:
          keys:
            - v2-vite-task-{{ arch }}-{{ checksum "bun.lock" }}
            - v2-vite-task-{{ arch }}-
      - run:
          name: Type-check, test, and build packages and Workers
          command: |
            bunx vp run --cache --filter './packages/*' --filter './workers/*' type-check
            bunx vp run --filter './packages/*' --filter './workers/*' test
            bunx vp run --cache --filter './packages/*' --filter './workers/*' build
      - save_cache:
          key: v2-vite-task-{{ arch }}-{{ checksum "bun.lock" }}
          paths:
            - node_modules/.vite/task-cache
      - run:
          name: Run repository fast checks
          command: |
            bun run lint
            bun run lint:dead
            bun run test:wrangler-drift
            bun run test:frontend-directives
            bun run format-check:cloudflare
            git diff --exit-code -- packages/contracts
            bun run test:ci-routing
            bun run test:ci-gate
      - run:
          name: Run PostgreSQL-backed integration suites
          # Step-level environment has the highest precedence, so protected
          # context values cannot override the loopback test database the
          # safety guard in scripts/ci/test-integration.mjs requires.
          command: |
            set -euo pipefail
            MELTIPLY_DATABASE_TEST_URL='postgres://meltiply_rls:meltiply-authenticated-local@127.0.0.1:5433/meltiply?sslmode=disable' \
              MELTIPLY_DATABASE_TEST_ADMIN_URL='postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable' \
              bun run test:integration
      - run:
          name: Stop containerized PostgreSQL test database
          command: ./scripts/cloudflare-local/database.sh stop
          when: always
      - cancel-sibling-workflows

  cloudflare-extended:
    executor: node-medium
    steps:
      - local-checkout
      - install-workspace
      - install-opentofu
      - run:
          name: Run release and staging harness tests
          command: |
            bun run release:test
            bun run test:staging
      - run:
          name: Verify supply-chain policy and generate SBOM
          command: |
            bun run test:supply-chain
            bun run security:supply-chain
      - store_artifacts:
          path: artifacts/sbom.cdx.json
          destination: sbom.cdx.json
      - run:
          name: Validate OpenTofu, infrastructure policy, and costs
          command: bun run iac:check
      - cancel-sibling-workflows

  frontend-full:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - local-checkout
      - install-machine-workspace
      - run:
          name: Format check
          working_directory: ~/project/frontend/app
          command: bun run format-check
      - run:
          name: Type check
          working_directory: ~/project/frontend/app
          command: bun run type-check
      - run:
          name: Cloudflare binding types
          working_directory: ~/project/frontend/app
          command: bun run cf-typegen:check
      - run:
          name: Lint
          working_directory: ~/project/frontend/app
          command: bun run lint
      - run:
          name: Dependency audit
          working_directory: ~/project/frontend/app
          command: bun run audit
      - run:
          name: Tests
          working_directory: ~/project/frontend/app
          command: bun run test --coverage
      - run:
          name: Install browser test runtime
          max_auto_reruns: 2
          auto_rerun_delay: 10s
          working_directory: ~/project/frontend/app
          command: |
            set -euo pipefail
            # Browser binaries and OS libraries live in the official image;
            # this avoids requiring root apt access on the shared runner.
            repo_root="$(cd ../.. && pwd)"
            image=mcr.microsoft.com/playwright:v1.64.0-noble
            docker pull "$image"
            # Remove reports left by older root-run containers, then recreate
            # the directories as the CircleCI user.
            docker run --rm -v "$repo_root:/work" "$image" \
              bash -lc 'rm -rf /work/frontend/app/test-results /work/frontend/app/playwright-report'
            mkdir -p "$repo_root/frontend/app/test-results" "$repo_root/frontend/app/playwright-report"
      - run:
          name: Browser journeys against the real local stack
          max_auto_reruns: 2
          auto_rerun_delay: 10s
          working_directory: ~/project/frontend/app
          command: |
            set -euo pipefail
            repo_root="$(cd ../.. && pwd)"
            frontend_preferred_port="${MELTIPLY_FRONTEND_PORT:-3000}"
            if [ -z "${MELTIPLY_FRONTEND_PORT:-}" ] && [ -n "${CIRCLE_WORKFLOW_ID:-}" ]; then
              workflow_hash="$(node -e 'const id=process.env.CIRCLE_WORKFLOW_ID; let hash=0; for (const character of id) hash=(hash * 31 + character.codePointAt(0)) >>> 0; process.stdout.write(String(hash));')"
              frontend_preferred_port="$(awk -v hash="$workflow_hash" 'BEGIN { print 3000 + (hash % 500) }')"
            fi
            frontend_port="$(node "$repo_root/scripts/cloudflare-local/available-port.mjs" "$frontend_preferred_port")"
            backend_port="$(node "$repo_root/scripts/cloudflare-local/available-port.mjs" "${WRANGLER_DEV_PORT:-8787}")"
            frontend_origin="http://127.0.0.1:${frontend_port}"
            api_base_url="http://127.0.0.1:${backend_port}"
            e2e_log="${TMPDIR:-/tmp}/meltiply-frontend-e2e-${USER:-ci}.log"
            e2e_container="meltiply-e2e-${CIRCLE_WORKFLOW_ID:-$$}"
            e2e_container="${e2e_container//[^A-Za-z0-9_.-]/_}"
            backend_pid=
            frontend_pid=
            kill_group() {
              local pid="$1"
              [[ -n "$pid" ]] || return 0
              kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
              for _ in $(seq 1 10); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.2
              done
              kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            }
            cleanup_frontend() {
              set +e
              kill_group "$frontend_pid"
              kill_group "$backend_pid"
              docker rm -f "$e2e_container" >/dev/null 2>&1 || true
              "$repo_root/scripts/cloudflare-local/teardown.sh" >/dev/null 2>&1 || true
              rm -f "$e2e_log"
            }
            trap cleanup_frontend EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            trap 'exit 129' HUP
            : >"$e2e_log"
            # Build once: browser snapshots and Lighthouse use this same
            # production bundle, without development-only inspection tooling.
            API_BASE_URL="$api_base_url" FRONTEND_URL="$frontend_origin" bun run build:production
            # The Playwright container supplies Chromium and all OS libraries;
            # web servers remain on the host and use the isolated hosted VM. --network host shares the host loopback, so the
            # container reaches these servers on 127.0.0.1 directly (no DNS).
            setsid env \
              WRANGLER_DEV_PORT="$backend_port" \
              WRANGLER_DEV_ALLOWED_ORIGINS="$frontend_origin" \
              WRANGLER_DEV_FRONTEND_URL="$frontend_origin" \
              WRANGLER_DEV_PUBLIC_API_URL="$api_base_url" \
              bash "$repo_root/scripts/cloudflare-local/dev-backend.sh" >>"$e2e_log" 2>&1 &
            backend_pid=$!
            setsid env API_BASE_URL="$api_base_url" FRONTEND_URL="$frontend_origin" \
              bun run --cwd "$repo_root/frontend/app" --no-install vp preview --host 127.0.0.1 --port "$frontend_port" --strictPort \
              >>"$e2e_log" 2>&1 &
            frontend_pid=$!
            ready=0
            # A cold PostgreSQL volume may use database.sh's full initialization
            # and stabilization windows before Wrangler can bind the API port.
            for _ in $(seq 1 240); do
              if curl --fail --silent --max-time 2 "$api_base_url/api/v1/health" >/dev/null 2>&1 && \
                curl --fail --silent --max-time 2 "$frontend_origin/assets" >/dev/null 2>&1; then
                ready=1
                break
              fi
              if ! kill -0 "$backend_pid" 2>/dev/null || ! kill -0 "$frontend_pid" 2>/dev/null; then
                cat "$e2e_log" >&2 || true
                exit 1
              fi
              sleep 1
            done
            if [[ "$ready" != "1" ]]; then
              cat "$e2e_log" >&2 || true
              exit 1
            fi
            browser_passed=0
            for attempt in 1 2; do
              if timeout --signal=TERM --kill-after=30s 1800s \
                docker run --rm --name "$e2e_container" --network host --ipc=host \
                --user "$(id -u):$(id -g)" \
                -v "$repo_root:/work" -w /work/frontend/app \
                -e CI=1 \
                -e MELTIPLY_E2E_REUSE_SERVERS=1 \
                -e MELTIPLY_E2E_API_BASE_URL="$api_base_url" \
                -e MELTIPLY_FRONTEND_PORT="$frontend_port" \
                mcr.microsoft.com/playwright:v1.64.0-noble \
                node_modules/.bin/playwright test --global-timeout=1740000; then
                browser_passed=1
                break
              fi
              if [[ "$attempt" == "1" ]]; then
                echo "Playwright journey failed; retrying in the same locked stack" >&2
              fi
            done
            [[ "$browser_passed" == "1" ]] || exit 1
            # Reuse the production frontend already verified by the journeys.
            # Do not rebuild or switch to a development dependency graph.
            mkdir -p "$repo_root/artifacts/performance"
            docker run --rm --network host --ipc=host \
              --user "$(id -u):$(id -g)" \
              -v "$repo_root:/work" -w /work/frontend/app \
              -e FRONTEND_PORT="$frontend_port" \
              mcr.microsoft.com/playwright:v1.64.0-noble \
              bash /work/scripts/ci/lighthouse.sh \
              "http://127.0.0.1:${frontend_port}/assets" \
              /work/artifacts/performance/lighthouse.json
      - store_artifacts:
          path: frontend/app/playwright-report
          destination: frontend-app-playwright-report
          when: always
      - store_test_results:
          path: frontend/app/test-results
          when: always
      - run:
          name: Check unified Astro public site
          working_directory: ~/project/frontend/public
          command: bun run check
      # The browser/performance step already builds the production Worker.
      - run:
          name: Stop frontend local stack
          command: |
            set -euo pipefail
            ./scripts/cloudflare-local/teardown.sh
            leftover="$(command docker ps -aq --filter name=meltiply-cloudflare 2>/dev/null || true)"
            if [[ -n "${leftover}" ]]; then
              echo "teardown left containers running:" >&2
              command docker ps -a --filter name=meltiply-cloudflare >&2 || true
              exit 1
            fi
          when: always
      - cancel-sibling-workflows

  cloudflare-integration:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - local-checkout
      - install-machine-workspace
      - run:
          name: Set up Worker-native local stack
          command: bun run setup --skip-dependencies --skip-image-pull
      - run:
          name: Prove PostgreSQL RLS tenant isolation
          command: bun run test:integration
      - run:
          name: Smoke multi-Worker local topology
          command: WRANGLER_DEV_PORT="$(node scripts/cloudflare-local/available-port.mjs "${WRANGLER_DEV_PORT:-8787}")" timeout --signal=TERM --kill-after=30s 180s bun run local:smoke
      - run:
          name: k6 load against the live local API
          command: |
            set -euo pipefail
            # Per-user log path: shared /tmp files from other accounts (or prior
            # agent runs) are not writable by circleci and break `: >logfile`.
            k6_log="${TMPDIR:-/tmp}/meltiply-k6-backend-${USER:-ci}.log"
            : >"$k6_log"
            backend_port="$(node scripts/cloudflare-local/available-port.mjs "${WRANGLER_DEV_PORT:-8787}")"
            api_base_url="http://127.0.0.1:${backend_port}"
            # smoke.sh stops workers on exit, so boot again for k6.
            setsid env WRANGLER_DEV_PORT="$backend_port" WRANGLER_DEV_PUBLIC_API_URL="$api_base_url" \
              bun run dev:backend >>"$k6_log" 2>&1 &
            backend_pid=$!
            cleanup_k6() {
              # Never fail the step on cleanup races; silence "No such process".
              set +e
              if [[ -n "${backend_pid:-}" ]]; then
                # setsid gives make + Wrangler one process group. Kill that
                # group directly; pgrep patterns can match this shell and an
                # unbounded wait can deadlock a canceled CI step.
                kill -TERM -- "-$backend_pid" 2>/dev/null || kill -TERM "$backend_pid" 2>/dev/null || true
                for _ in $(seq 1 10); do
                  kill -0 "$backend_pid" 2>/dev/null || break
                  sleep 0.2
                done
                kill -KILL -- "-$backend_pid" 2>/dev/null || kill -KILL "$backend_pid" 2>/dev/null || true
                wait "$backend_pid" 2>/dev/null || true
              fi
            }
            abort_k6() {
              local code="$1"
              cleanup_k6
              ./scripts/cloudflare-local/teardown.sh >/dev/null 2>&1 || true
              exit "$code"
            }
            trap cleanup_k6 EXIT
            trap 'abort_k6 130' INT
            trap 'abort_k6 143' TERM
            trap 'abort_k6 129' HUP
            ready=0
            for _ in $(seq 1 60); do
              if curl --fail --silent --max-time 2 "$api_base_url/api/v1/health" >/dev/null 2>&1; then
                ready=1
                break
              fi
              if ! kill -0 "$backend_pid" 2>/dev/null; then
                cat "$k6_log" >&2 || true
                exit 1
              fi
              sleep 1
            done
            if [[ "$ready" != "1" ]]; then
              echo "API never became healthy for k6" >&2
              cat "$k6_log" >&2 || true
              exit 1
            fi
            mkdir -p artifacts/performance
            timeout --signal=TERM --kill-after=30s 120s \
              env BASE_URL="$api_base_url" bun run local:k6:ci \
              | tee artifacts/performance/k6.log
            cleanup_k6
            trap - EXIT HUP INT TERM
      - run:
          name: Stop Cloudflare target stack
          command: |
            set -euo pipefail
            ./scripts/cloudflare-local/teardown.sh
            # Fail the cleanup step if anything meltiply-cloudflare remains.
            leftover="$(command docker ps -aq --filter name=meltiply-cloudflare 2>/dev/null || true)"
            if [[ -n "${leftover}" ]]; then
              echo "teardown left containers running:" >&2
              command docker ps -a --filter name=meltiply-cloudflare >&2 || true
              exit 1
            fi
          when: always
      - cancel-sibling-workflows

  staging-quality-gate:
    executor: node-small
    steps:
      - local-checkout
      - run:
          name: Confirm staging quality gate
          command: echo "Staging fast quality lane completed successfully."
      - cancel-sibling-workflows

  staging-initial-plan:
    executor: node
    working_directory: ~/project/staging-initial-plan
    steps:
      - local-checkout
      - install-target-workspace
      - install-opentofu
      - run:
          name: Plan bootstrap foundation or update pause
          command: |
            set -euo pipefail
            : "${MELTIPLY_RELEASE_INPUT:?MELTIPLY_RELEASE_INPUT must point to reviewed release JSON}"
            test -r "$MELTIPLY_RELEASE_INPUT"
            release_dir="$PWD/.release"
            rm -rf "$release_dir" artifacts/staging-initial-plan
            mkdir -p "$release_dir" artifacts/staging-initial-plan
            cp -- "$MELTIPLY_RELEASE_INPUT" "$release_dir/release-input.json"
            export MELTIPLY_RELEASE_INPUT="$release_dir/release-input.json"
            export MELTIPLY_RELEASE_DIR="$release_dir"
            bun run release:preflight:offline \
              --input "$MELTIPLY_RELEASE_INPUT" --out-dir "$release_dir"
            mode="$(node -e 'const value=require("node:fs").readFileSync(process.argv[1],"utf8");process.stdout.write(JSON.parse(value).deployment_mode)' "$MELTIPLY_RELEASE_INPUT")"
            printf '%s\n' "$mode" >"$release_dir/deployment-mode"
            case "$mode" in
              bootstrap)
                : "${MELTIPLY_IAC_FOUNDATION_TFVARS:?Set bootstrap foundation tfvars}"
                phase=foundation
                tfvars="$MELTIPLY_IAC_FOUNDATION_TFVARS"
                ;;
              update)
                : "${MELTIPLY_IAC_PAUSE_TFVARS:?Set update pause tfvars}"
                phase=pause
                tfvars="$MELTIPLY_IAC_PAUSE_TFVARS"
                ;;
              *) echo "Unsupported deployment_mode: $mode" >&2; exit 1 ;;
            esac
            ./scripts/infra/staging-transition.sh plan "$phase" "$tfvars"
            printf '%s\n' "$phase" >"$release_dir/initial-phase"
            cp -- "$release_dir/$phase-plan-summary.json" \
              "$release_dir/$phase-plan.sha256" artifacts/staging-initial-plan/
      - store_artifacts:
          path: artifacts/staging-initial-plan
          destination: staging-initial-plan
      - persist_to_workspace:
          root: ~/project/staging-initial-plan
          paths:
            - .release

  staging-initial-apply:
    executor: node
    working_directory: ~/project/staging-initial-apply
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-initial-apply
      - install-target-workspace
      - install-opentofu
      - run:
          name: Apply, pause Cron, protect data, and migrate
          command: |
            set -euo pipefail
            if [ -n "${MELTIPLY_RELEASE_SECRETS_JSON:-}" ]; then
              echo "MELTIPLY_RELEASE_SECRETS_JSON must exist only in the staging secrets context" >&2
              exit 1
            fi
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            phase="$(<.release/initial-phase)"
            digest="$(<.release/$phase-plan.sha256)"
            approval="$PWD/.release/approval-foundation.json"
            node scripts/ci/circleci-approval.mjs \
              staging-foundation-approval "$digest" "$approval"
            bun run release:preflight \
              --input "$MELTIPLY_RELEASE_INPUT" --out-dir "$MELTIPLY_RELEASE_DIR"
            ./scripts/infra/staging-transition.sh apply "$phase"
            export MELTIPLY_RELEASE_IAC_OUTPUTS="$PWD/.release/iac-outputs.json"
            bun run release:render \
              --input "$MELTIPLY_RELEASE_INPUT" \
              --iac-outputs "$MELTIPLY_RELEASE_IAC_OUTPUTS" \
              --out-dir "$MELTIPLY_RELEASE_DIR"
            bun run release:cron \
              --phase cron-pause --input "$MELTIPLY_RELEASE_INPUT" \
              --out-dir "$MELTIPLY_RELEASE_DIR" --plan-digest "$digest" \
              --approval-metadata "$approval" --apply \
              --confirm "release staging $CIRCLE_SHA1"
            bun run release:restore-point \
              --input "$MELTIPLY_RELEASE_INPUT" \
              --iac-outputs "$MELTIPLY_RELEASE_IAC_OUTPUTS" \
              --out-dir "$MELTIPLY_RELEASE_DIR" --plan-digest "$digest" \
              --approval-metadata "$approval" --apply \
              --confirm "release staging $CIRCLE_SHA1"
            mode="$(<.release/deployment-mode)"
            case "$mode" in
              bootstrap) migration_phase=bootstrap ;;
              update) migration_phase=expand ;;
              *) echo "Unsupported deployment_mode: $mode" >&2; exit 1 ;;
            esac
            bun run release:migrate \
              --phase "$migration_phase" --input "$MELTIPLY_RELEASE_INPUT" \
              --out-dir "$MELTIPLY_RELEASE_DIR" --plan-digest "$digest" \
              --approval-metadata "$approval" --apply \
              --confirm "release staging $CIRCLE_SHA1"
      - persist_to_workspace:
          root: ~/project/staging-initial-apply
          paths:
            - .release

  staging-state-automation-deploy:
    executor: node
    working_directory: ~/project/staging-state-automation-deploy
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-state-automation-deploy
      - install-target-workspace
      - run:
          name: Initialize or update State and Automation safely
          command: |
            set -euo pipefail
            : "${MELTIPLY_RELEASE_SECRETS_JSON:?Set the protected secret JSON value}"
            secret_json="$MELTIPLY_RELEASE_SECRETS_JSON"
            unset MELTIPLY_RELEASE_SECRETS_JSON
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_IAC_OUTPUTS="$PWD/.release/iac-outputs.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            phase="$(<.release/initial-phase)"
            digest="$(<.release/$phase-plan.sha256)"
            approval="$PWD/.release/approval-foundation.json"
            mode="$(<.release/deployment-mode)"
            mutate_worker() {
              bun run release:deploy \
                --phase "$1" --step "$2" --input "$MELTIPLY_RELEASE_INPUT" \
                --out-dir "$MELTIPLY_RELEASE_DIR" --plan-digest "$digest" \
                --approval-metadata "$approval" --apply \
                --confirm "release staging $CIRCLE_SHA1"
            }
            if [ "$mode" = bootstrap ]; then
              mutate_worker state-bootstrap initialize
              mutate_worker automation-bootstrap initialize
              automation_phase=automation-bootstrap
            else
              mutate_worker state-update upload
              mutate_worker state-update activate
              mutate_worker automation-update upload
              automation_phase=automation-update
            fi
            printf '%s' "$secret_json" | bun run release:secrets \
              --phase automation --input "$MELTIPLY_RELEASE_INPUT" \
              --out-dir "$MELTIPLY_RELEASE_DIR" --plan-digest "$digest" \
              --approval-metadata "$approval" --apply \
              --confirm "release staging $CIRCLE_SHA1"
            unset secret_json
            mutate_worker "$automation_phase" activate
      - persist_to_workspace:
          root: ~/project/staging-state-automation-deploy
          paths:
            - .release

  staging-consumers-plan:
    executor: node
    working_directory: ~/project/staging-consumers-plan
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-consumers-plan
      - install-target-workspace
      - install-opentofu
      - run:
          name: Plan paused consumer attachment for bootstrap
          command: |
            set -euo pipefail
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            mode="$(<.release/deployment-mode)"
            if [ "$mode" = update ]; then
              printf 'already-attached\n' >.release/consumers-transition
              exit 0
            fi
            : "${MELTIPLY_IAC_CONSUMERS_TFVARS:?Set paused-consumer tfvars}"
            ./scripts/infra/staging-transition.sh plan paused-consumers \
              "$MELTIPLY_IAC_CONSUMERS_TFVARS"
            printf 'planned\n' >.release/consumers-transition
      - persist_to_workspace:
          root: ~/project/staging-consumers-plan
          paths:
            - .release

  staging-consumers-apply:
    executor: node
    working_directory: ~/project/staging-consumers-apply
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-consumers-apply
      - install-target-workspace
      - install-opentofu
      - run:
          name: Attach consumers while Queue delivery remains paused
          command: |
            set -euo pipefail
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            if [ "$(<.release/consumers-transition)" = planned ]; then
              ./scripts/infra/staging-transition.sh apply paused-consumers
              export MELTIPLY_RELEASE_IAC_OUTPUTS="$PWD/.release/iac-outputs.json"
              bun run release:render \
                --input "$MELTIPLY_RELEASE_INPUT" \
                --iac-outputs "$MELTIPLY_RELEASE_IAC_OUTPUTS" \
                --out-dir "$MELTIPLY_RELEASE_DIR"
            fi
      - persist_to_workspace:
          root: ~/project/staging-consumers-apply
          paths:
            - .release

  staging-api-candidate:
    executor: node
    working_directory: ~/project/staging-api-candidate
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-api-candidate
      - install-target-workspace
      - run:
          name: Upload API candidate and create its secret version
          command: |
            set -euo pipefail
            : "${MELTIPLY_RELEASE_SECRETS_JSON:?Set the protected secret JSON value}"
            secret_json="$MELTIPLY_RELEASE_SECRETS_JSON"
            unset MELTIPLY_RELEASE_SECRETS_JSON
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_IAC_OUTPUTS="$PWD/.release/iac-outputs.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            initial_phase="$(<.release/initial-phase)"
            digest="$(<.release/$initial_phase-plan.sha256)"
            approval="$PWD/.release/approval-foundation.json"
            mode="$(<.release/deployment-mode)"
            step=upload
            [ "$mode" = bootstrap ] && step=initialize
            bun run release:deploy \
              --phase "api-$mode" --step "$step" \
              --input "$MELTIPLY_RELEASE_INPUT" --out-dir "$MELTIPLY_RELEASE_DIR" \
              --plan-digest "$digest" --approval-metadata "$approval" --apply \
              --confirm "release staging $CIRCLE_SHA1"
            printf '%s' "$secret_json" | bun run release:secrets \
              --phase api --input "$MELTIPLY_RELEASE_INPUT" \
              --out-dir "$MELTIPLY_RELEASE_DIR" --plan-digest "$digest" \
              --approval-metadata "$approval" --apply \
              --confirm "release staging $CIRCLE_SHA1"
            unset secret_json
            if [ "$mode" = bootstrap ]; then
              bun run release:deploy \
                --phase api-bootstrap --step activate \
                --input "$MELTIPLY_RELEASE_INPUT" --out-dir "$MELTIPLY_RELEASE_DIR" \
                --plan-digest "$digest" --approval-metadata "$approval" --apply \
                --confirm "release staging $CIRCLE_SHA1"
            fi
      - persist_to_workspace:
          root: ~/project/staging-api-candidate
          paths:
            - .release

  staging-version-smoke:
    executor: node
    working_directory: ~/project/staging-version-smoke
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-version-smoke
      - install-target-workspace
      - run:
          name: Verify the immutable API candidate version
          command: |
            set -euo pipefail
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_IAC_OUTPUTS="$PWD/.release/iac-outputs.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            bun run release:smoke \
              --phase version --input "$MELTIPLY_RELEASE_INPUT" \
              --out-dir "$MELTIPLY_RELEASE_DIR"
      - persist_to_workspace:
          root: ~/project/staging-version-smoke
          paths:
            - .release

  staging-domain-plan:
    executor: node
    working_directory: ~/project/staging-domain-plan
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-domain-plan
      - install-target-workspace
      - install-opentofu
      - run:
          name: Plan paused custom-domain attachment
          command: |
            set -euo pipefail
            : "${MELTIPLY_IAC_DOMAIN_TFVARS:?Set domain-attached paused tfvars}"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            ./scripts/infra/staging-transition.sh plan domain \
              "$MELTIPLY_IAC_DOMAIN_TFVARS"
            rm -rf artifacts/staging-domain-plan
            mkdir -p artifacts/staging-domain-plan
            cp -- .release/domain-plan-summary.json .release/domain-plan.sha256 \
              artifacts/staging-domain-plan/
      - store_artifacts:
          path: artifacts/staging-domain-plan
          destination: staging-domain-plan
      - persist_to_workspace:
          root: ~/project/staging-domain-plan
          paths:
            - .release

  staging-domain-apply-rollout:
    executor: node
    working_directory: ~/project/staging-domain-apply-rollout
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-domain-apply-rollout
      - install-target-workspace
      - install-opentofu
      - run:
          name: Attach domain and promote API with live checks
          command: |
            set -euo pipefail
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            digest="$(<.release/domain-plan.sha256)"
            approval="$PWD/.release/approval-traffic.json"
            node scripts/ci/circleci-approval.mjs \
              staging-traffic-approval "$digest" "$approval"
            ./scripts/infra/staging-transition.sh apply domain
            export MELTIPLY_RELEASE_IAC_OUTPUTS="$PWD/.release/iac-outputs.json"
            mode="$(<.release/deployment-mode)"
            if [ "$mode" = bootstrap ]; then
              bun run release:smoke \
                --phase live --input "$MELTIPLY_RELEASE_INPUT" \
                --out-dir "$MELTIPLY_RELEASE_DIR"
            else
              for percentage in 5 25 50 100; do
                bun run release:deploy \
                  --phase api-rollout --percentage "$percentage" \
                  --input "$MELTIPLY_RELEASE_INPUT" --out-dir "$MELTIPLY_RELEASE_DIR" \
                  --plan-digest "$digest" --approval-metadata "$approval" --apply \
                  --confirm "release staging $CIRCLE_SHA1"
                bun run release:smoke \
                  --phase live --percentage "$percentage" \
                  --input "$MELTIPLY_RELEASE_INPUT" --out-dir "$MELTIPLY_RELEASE_DIR"
              done
            fi
      - persist_to_workspace:
          root: ~/project/staging-domain-apply-rollout
          paths:
            - .release

  # This plan is intentionally generated only after domain application, API
  # promotion, and live smoke. It cannot be stale relative to those changes.
  staging-unpause-plan:
    executor: node
    working_directory: ~/project/staging-unpause-plan
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-unpause-plan
      - install-target-workspace
      - install-opentofu
      - run:
          name: Plan final Queue delivery resume
          command: |
            set -euo pipefail
            : "${MELTIPLY_IAC_RESUME_TFVARS:?Set final unpaused tfvars}"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            ./scripts/infra/staging-transition.sh plan unpause \
              "$MELTIPLY_IAC_RESUME_TFVARS"
            rm -rf artifacts/staging-unpause-plan
            mkdir -p artifacts/staging-unpause-plan
            cp -- .release/unpause-plan-summary.json .release/unpause-plan.sha256 \
              artifacts/staging-unpause-plan/
      - store_artifacts:
          path: artifacts/staging-unpause-plan
          destination: staging-unpause-plan
      - persist_to_workspace:
          root: ~/project/staging-unpause-plan
          paths:
            - .release

  staging-unpause-apply:
    executor: node
    working_directory: ~/project/staging-unpause-apply
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-unpause-apply
      - install-target-workspace
      - install-opentofu
      - run:
          name: Resume Queue delivery after explicit approval
          command: |
            set -euo pipefail
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            digest="$(<.release/unpause-plan.sha256)"
            approval="$PWD/.release/approval-queue-resume.json"
            node scripts/ci/circleci-approval.mjs \
              staging-queue-resume-approval "$digest" "$approval"
            ./scripts/infra/staging-transition.sh apply unpause
            export MELTIPLY_RELEASE_IAC_OUTPUTS="$PWD/.release/iac-outputs.json"
            bun run release:cron \
              --phase cron-activate --input "$MELTIPLY_RELEASE_INPUT" \
              --out-dir "$MELTIPLY_RELEASE_DIR" --plan-digest "$digest" \
              --approval-metadata "$approval" --apply \
              --confirm "release staging $CIRCLE_SHA1"
      - persist_to_workspace:
          root: ~/project/staging-unpause-apply
          paths:
            - .release

  staging-manifest:
    executor: node
    working_directory: ~/project/staging-manifest
    steps:
      - local-checkout
      - attach_workspace:
          at: ~/project/staging-manifest
      - install-target-workspace
      - run:
          name: Publish allowlisted redacted release evidence
          command: |
            set -euo pipefail
            export MELTIPLY_RELEASE_INPUT="$PWD/.release/release-input.json"
            export MELTIPLY_RELEASE_IAC_OUTPUTS="$PWD/.release/iac-outputs.json"
            export MELTIPLY_RELEASE_DIR="$PWD/.release"
            bun run release:manifest \
              --input "$MELTIPLY_RELEASE_INPUT" --out-dir "$MELTIPLY_RELEASE_DIR" \
              --approval-metadata .release/approval-foundation.json \
              --approval-metadata .release/approval-traffic.json \
              --approval-metadata .release/approval-queue-resume.json
            rm -rf artifacts/staging-release
            mkdir -p artifacts/staging-release
            for evidence in \
              release-manifest.json migration-evidence.json \
              worker-state-candidate.json worker-state-deployment.json \
              worker-automation-candidate.json worker-automation-secrets.json \
              worker-automation-deployment.json worker-api-candidate.json \
              worker-api-secrets.json worker-api-deployment.json \
              api-rollout-5.json api-rollout-25.json api-rollout-50.json \
              api-rollout-100.json smoke-version.json smoke-live.json \
              smoke-live-5.json smoke-live-25.json smoke-live-50.json \
              smoke-live-100.json foundation-plan-summary.json \
              pause-plan-summary.json paused-consumers-plan-summary.json \
              domain-plan-summary.json unpause-plan-summary.json \
              foundation-plan.sha256 pause-plan.sha256 \
              paused-consumers-plan.sha256 domain-plan.sha256 \
              unpause-plan.sha256 approval-foundation.json \
              approval-traffic.json approval-queue-resume.json \
              iac-outputs-foundation.json iac-outputs-pause.json \
              iac-outputs-paused-consumers.json iac-outputs-domain.json \
              iac-outputs-unpause.json restore-point-evidence.json \
              automation-cron-paused.json \
              automation-cron-active.json; do
              if [ -f ".release/$evidence" ]; then
                cp -- ".release/$evidence" "artifacts/staging-release/$evidence"
              fi
            done
            test -f artifacts/staging-release/release-manifest.json
            if find artifacts/staging-release -type f \
              \( -name '*.tfplan' -o -name 'release-input.json' -o -name 'wrangler*.json' \) \
              -print -quit | grep -q .; then
              echo "Unsafe raw release artifact selected" >&2
              exit 1
            fi
      - store_artifacts:
          path: artifacts/staging-release
          destination: staging-release

workflows:
  # The lightweight gate is the sole CircleCI status required by branch
  # protection. Native workflow DAG dependencies coordinate quality jobs
  # without API polling or keeping executors waiting.
  automatic-both:
    when:
      and:
        - << pipeline.parameters.run-frontend >>
        - not: << pipeline.parameters.frontend-full >>
        - << pipeline.parameters.run-cloudflare >>
    jobs:
      - baseline:
          context:
            - meltiply-ci
      - frontend-fast:
          context:
            - meltiply-ci
      - cloudflare-fast:
          context:
            - meltiply-ci
      - ci-gate:
          context:
            - meltiply-ci
          requires:
            - baseline
            - frontend-fast
            - cloudflare-fast

  automatic-frontend:
    when:
      and:
        - << pipeline.parameters.run-frontend >>
        - not: << pipeline.parameters.frontend-full >>
        - not: << pipeline.parameters.run-cloudflare >>
    jobs:
      - baseline:
          context:
            - meltiply-ci
      - frontend-fast:
          context:
            - meltiply-ci
      - ci-gate:
          context:
            - meltiply-ci
          requires:
            - baseline
            - frontend-fast

  automatic-cloudflare:
    when:
      and:
        - not:
            and:
              - << pipeline.parameters.run-frontend >>
              - not: << pipeline.parameters.frontend-full >>
        - << pipeline.parameters.run-cloudflare >>
    jobs:
      - baseline:
          context:
            - meltiply-ci
      - cloudflare-fast:
          context:
            - meltiply-ci
      - ci-gate:
          context:
            - meltiply-ci
          requires:
            - baseline
            - cloudflare-fast

  automatic-baseline:
    when:
      and:
        - not:
            and:
              - << pipeline.parameters.run-frontend >>
              - not: << pipeline.parameters.frontend-full >>
        - not: << pipeline.parameters.run-cloudflare >>
    jobs:
      - baseline:
          context:
            - meltiply-ci
      - ci-gate:
          context:
            - meltiply-ci
          requires:
            - baseline

  frontend-full:
    when: << pipeline.parameters.frontend-full >>
    jobs:
      - frontend-full:
          context:
            - meltiply-ci

  cloudflare-integration:
    when: << pipeline.parameters.cloudflare-integration >>
    jobs:
      - cloudflare-integration:
          context:
            - meltiply-ci

  cloudflare-extended:
    when: << pipeline.parameters.cloudflare-extended >>
    jobs:
      - cloudflare-extended:
          context:
            - meltiply-ci

  # This remains a default-branch-only, explicit manual pipeline. Its quality
  # gate verifies the cloudflare-fast lane before exposing any protected approval hold.
  staging-release:
    when:
      and:
        - equal: [master, << pipeline.git.branch >>]
        - << pipeline.parameters.staging-release >>
    jobs:
      - cloudflare-fast:
          context:
            - meltiply-ci
      - staging-quality-gate:
          context:
            - meltiply-ci
          requires:
            - cloudflare-fast
      - staging-initial-plan:
          context:
            - meltiply-staging-plan
          requires:
            - staging-quality-gate
      - staging-foundation-approval:
          type: approval
          requires:
            - staging-initial-plan
      - staging-initial-apply:
          context:
            - meltiply-ci
            - meltiply-staging-release
          requires:
            - staging-foundation-approval
      - staging-state-automation-deploy:
          context:
            - meltiply-ci
            - meltiply-staging-release
            - meltiply-staging-secrets
          requires:
            - staging-initial-apply
