name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.route.outputs.frontend }}
      cloudflare: ${{ steps.route.outputs.cloudflare }}
      selfhost: ${{ steps.route.outputs.selfhost }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Select automatic fast lanes
        id: route
        run: node scripts/ci/github-routing.mjs

  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Scan full history for secrets
        run: |
          ./scripts/ci/install-quality-tool.sh gitleaks
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/ci/gitleaks-check.sh --all-history
      - name: Check documentation and routing behavior
        run: |
          node --test scripts/ci/docs-links.test.mjs scripts/ci/github-routing.test.mjs
          node scripts/ci/docs-links.mjs

  frontend-fast:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - name: Format, type, bindings, lint, coverage, and production builds
        run: |
          bun run --cwd frontend/app format-check
          bun run --cwd frontend/app type-check
          bun run --cwd frontend/app cf-typegen:check
          bun run --cwd frontend/app lint
          bun run --cwd frontend/app test --coverage
          bun run --cwd frontend/app build:production
          bun run --cwd frontend/public check

  cloudflare-fast:
    needs: changes
    if: needs.changes.outputs.cloudflare == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - name: Check CI file formatting
        run: bunx --no-install vp fmt scripts/ci/github-routing.mjs scripts/ci/github-routing.test.mjs .github/workflows/ci.yml .github/actions/install-workspace/action.yml docs/public-ci.md --check
      - name: Start isolated PostgreSQL
        run: ./scripts/cloudflare-local/compose.sh up -d postgres
      - name: Check spelling
        run: |
          ./scripts/ci/install-quality-tool.sh typos
          export PATH="$HOME/.local/bin:$PATH"
          typos --config .typos.toml
      - name: Validate contracts and generated Worker bindings
        run: |
          bun run contract:check
          bun run workers:types
          git diff --exit-code -- workers/api/worker-configuration.d.ts workers/automation/worker-configuration.d.ts workers/state/worker-configuration.d.ts
      - name: Restore content-addressed build tasks
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.vite/task-cache
          key: vite-v1-${{ runner.os }}-${{ runner.arch }}-node24-bun1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'patches/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-v1-${{ runner.os }}-${{ runner.arch }}-node24-bun1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'patches/**') }}-
      - name: Type-check, test, and build packages and Workers
        run: |
          bunx vp run --cache --filter './packages/*' --filter './workers/*' --concurrency-limit 1 type-check
          bunx vp run --filter './packages/*' --filter './workers/*' --concurrency-limit 1 test
          bunx vp run --cache --filter './packages/*' --filter './workers/*' --concurrency-limit 1 build
      - name: Save successful build tasks
        uses: actions/cache/save@v5
        with:
          path: node_modules/.vite/task-cache
          key: vite-v1-${{ runner.os }}-${{ runner.arch }}-node24-bun1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'patches/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Repository fast checks
        run: |
          bun run lint
          bun run lint:dead
          bun run test:wrangler-drift
          bun run test:frontend-directives
          bun run format-check:cloudflare
          bunx --no-install vp fmt .github/workflows/ci.yml .github/workflows/selfhost.yml .github/workflows/selfhost-ci.yml .github/actions/install-workspace/action.yml scripts/selfhost compose.selfhost.yml docs/public-ci.md --check
          git diff --exit-code -- packages/contracts
          bun run test:ci-routing
      - name: Local tooling, release, and supply-chain contracts
        run: |
          bun run test:local-setup
          bun run test:available-port
          bun run test:wrangler-env
          bun run test:teardown
          bun run test:dev
          bun run test:quick-tunnel
          bun run test:tunnel-hostname
          bun run test:doctor
          bun run test:k6-runner
          bun run release:test
          bun run test:supply-chain
          bun run security:supply-chain
          bun run cost:check
      - name: PostgreSQL integration tests
        env:
          MELTIPLY_DATABASE_TEST_URL: postgres://meltiply_rls:meltiply-authenticated-local@127.0.0.1:5433/meltiply?sslmode=disable
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
        run: bun run test:integration
      - name: Stop isolated PostgreSQL
        if: always()
        run: ./scripts/cloudflare-local/database.sh stop

  frontend-performance:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.cloudflare == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - name: Prepare deterministic populated stack
        run: bun run setup --skip-dependencies --skip-image-pull
      - name: Install Chromium
        run: bun run --cwd frontend/app --no-install playwright install --with-deps chromium
      - name: Measure production publishing journeys
        env:
          MELTIPLY_E2E_START_PUBLIC: "1"
          MELTIPLY_E2E_PUBLIC_BASE_URL: http://127.0.0.1:4321
        run: bun run --cwd frontend/app test:performance
      - name: Exercise publishing preferences in the browser
        run: bun run --cwd frontend/app test:e2e e2e/publishing-preferences.spec.ts --project chromium
      - name: Upload traces and reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-performance-${{ github.run_id }}
          path: |
            frontend/app/test-results/
            frontend/app/playwright-report/
          if-no-files-found: warn

  selfhost-images:
    needs: changes
    if: needs.changes.outputs.selfhost == 'true'
    uses: ./.github/workflows/selfhost-ci.yml

  ci-gate:
    needs:
      [changes, baseline, frontend-fast, cloudflare-fast, frontend-performance, selfhost-images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected lane to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          BASELINE: ${{ needs.baseline.result }}
          FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
          FRONTEND: ${{ needs.frontend-fast.result }}
          CLOUDFLARE_SELECTED: ${{ needs.changes.outputs.cloudflare }}
          CLOUDFLARE: ${{ needs.cloudflare-fast.result }}
          PERFORMANCE_SELECTED: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.cloudflare == 'true' }}
          PERFORMANCE: ${{ needs.frontend-performance.result }}
          SELFHOST_SELECTED: ${{ needs.changes.outputs.selfhost }}
          SELFHOST_IMAGES: ${{ needs.selfhost-images.result }}
        run: |
          test "$CHANGES" = success
          test "$BASELINE" = success
          if [ "$SELFHOST_SELECTED" = true ]; then
            test "$SELFHOST_IMAGES" = success
          else
            test "$SELFHOST_IMAGES" = skipped
          fi
          if [ "$PERFORMANCE_SELECTED" = true ]; then
            test "$PERFORMANCE" = success
          else
            test "$PERFORMANCE" = skipped
          fi
          if [ "$FRONTEND_SELECTED" = true ]; then
            test "$FRONTEND" = success
          else
            test "$FRONTEND" = skipped
          fi
          if [ "$CLOUDFLARE_SELECTED" = true ]; then
            test "$CLOUDFLARE" = success
          else
            test "$CLOUDFLARE" = skipped
          fi
