name: Cleanup contract generation
on:
  push:
    branches: [chore/public-community-cleanup]
    paths: [.github/workflows/cleanup-codegen.yml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - run: bun run contract:generate && bun run contract:readiness:generate
      - uses: actions/upload-artifact@v4
        with:
          name: generated-contracts
          path: |
            packages/contracts/src/generated/schema.ts
            packages/contracts/endpoint-readiness.md
