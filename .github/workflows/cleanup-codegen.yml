name: Cleanup contract generation
on:
  workflow_dispatch:
    inputs:
      patch:
        description: Base64-encoded uncommitted React patch for hosted audit
        required: true
        type: string
  push:
    branches: [chore/public-community-cleanup]
    paths: [.github/workflows/cleanup-codegen.yml, packages/contracts/openapi.yaml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - run: bun run contract:generate && bun run contract:readiness:generate
      - uses: actions/upload-artifact@v4
        with:
          name: generated-contracts
          path: |
            packages/contracts/src/generated/schema.ts
            packages/contracts/endpoint-readiness.md
  react-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - name: Audit uncommitted React changes
        env:
          REACT_PATCH: ${{ inputs.patch }}
        run: |
          printf '%s' "$REACT_PATCH" | base64 --decode | git apply
          npx react-doctor@latest --verbose --scope changed
