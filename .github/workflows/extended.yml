name: Extended checks

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Additional hosted validation
        required: true
        type: choice
        options:
          - frontend-full
          - frontend-ui
          - cloudflare-integration
          - cloudflare-extended
          - cloudflare-full
          - device-authorization
          - versioned-contract
          - object-storage
          - publishing-queues
          - publishing-flow
          - publishing-browser
          - portable-caching
          - portable-caching-smoke
          - performance-focused
          - performance-backend
          - performance-media

permissions:
  contents: read

concurrency:
  group: extended-${{ inputs.lane }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - name: Exercise publishing regressions
        if: inputs.lane == 'publishing-flow'
        run: |
          status=0
          bun run --cwd frontend/app test src/components/composer/composer.test.tsx src/lib/platform-capabilities-retention.test.tsx --coverage.enabled=false || status=1
          bun run --cwd packages/providers test test/facebook.test.ts test/instagram.test.ts test/threads.test.ts test/tiktok.test.ts test/youtube.test.ts --coverage.enabled=false || status=1
          exit "$status"
      - name: Review publishing React changes
        if: inputs.lane == 'publishing-flow'
        working-directory: frontend/app
        run: npx --yes react-doctor@0.9.18 --verbose --scope changed --base origin/${{ github.event.repository.default_branch }}
      - name: Prepare publishing acceptance
        if: (success() || failure()) && (inputs.lane == 'publishing-flow' || inputs.lane == 'publishing-browser')
        run: |
          bun run setup --skip-dependencies --skip-image-pull
          bun run --cwd frontend/app --no-install playwright install --with-deps chromium
          status=0
          if [ "${{ inputs.lane }}" = publishing-flow ]; then bun run cloudflare:check || status=1; fi
          bun run docs:links || status=1
          exit "$status"
      - name: Exercise full publishing lifecycle
        if: (success() || failure()) && (inputs.lane == 'publishing-flow' || inputs.lane == 'publishing-browser')
        env:
          MELTIPLY_E2E_ACCEPTANCE: "1"
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
        run: |
          bash scripts/cloudflare-local/database.sh reset
          status=0
          bun run --cwd frontend/app test:e2e e2e/posts-publication.spec.ts --project publication --trace on --retries 0 || status=1
          # Each Playwright run clears test-results, so keep this journey's traces
          # before the next journey overwrites them.
          mkdir -p artifacts/publishing/publication
          cp -R frontend/app/test-results/. artifacts/publishing/publication/ 2>/dev/null || true
          exit "$status"
      - name: Exercise publishing queues
        if: (success() || failure()) && (inputs.lane == 'publishing-flow' || inputs.lane == 'publishing-browser')
        env:
          MELTIPLY_E2E_ACCEPTANCE: "1"
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
        run: |
          bash scripts/cloudflare-local/database.sh reset
          status=0
          bun run --cwd frontend/app test:e2e e2e/publishing-queues.spec.ts --project queues --trace on --retries 0 || status=1
          mkdir -p artifacts/publishing/queues
          cp -R frontend/app/test-results/. artifacts/publishing/queues/ 2>/dev/null || true
          exit "$status"
      - name: Exercise multi-profile delivery recovery
        if: (success() || failure()) && (inputs.lane == 'publishing-flow' || inputs.lane == 'publishing-browser')
        env:
          MELTIPLY_E2E_ACCEPTANCE: "1"
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
        run: |
          bash scripts/cloudflare-local/database.sh reset
          status=0
          bun run --cwd frontend/app test:e2e e2e/posts-composer.spec.ts --project composer --grep "recovers independent profile copies and retries only unfinished publishing" --trace on --retries 0 || status=1
          mkdir -p artifacts/publishing/recovery
          cp -R frontend/app/test-results/. artifacts/publishing/recovery/ 2>/dev/null || true
          exit "$status"
      - name: Exercise native processor restart and replay
        if: inputs.lane == 'performance-media'
        run: bun run --filter @meltiply/automation-worker smoke:processor
      - name: Type-check and exercise browser cache regressions
        if: inputs.lane == 'performance-focused'
        run: |
          bun run --filter frontend-app type-check
          bun run --cwd frontend/app test src/lib/browser-cache.test.tsx --coverage.enabled=false
          node --test scripts/infra/cost-model.test.mjs scripts/infra/queue-ops.test.mjs scripts/infra/queue-alert.test.mjs scripts/benchmarks/backend/placement-compare.test.mjs
      - name: Exercise authenticated request and Worker ownership changes
        if: inputs.lane == 'performance-backend'
        env:
          MELTIPLY_DATABASE_TEST_URL: postgres://meltiply_rls:meltiply-authenticated-local@127.0.0.1:5433/meltiply?sslmode=disable
        run: |
          bun run setup --skip-dependencies --skip-image-pull
          bun run --filter @meltiply/database --filter @meltiply/api-worker --filter @meltiply/automation-worker type-check
          bun run --cwd workers/api --no-install vp test run test/actor-resolution.test.ts
          bun run --cwd workers/automation test test/provider-sync-due.test.ts test/worker.test.ts --coverage.enabled=false
          bun run --cwd workers/api test:integration test/core-service.integration.test.ts --testNamePattern="summary|analytics|cache"
          bun run --cwd workers/api test:integration test/better-auth.integration.test.ts test/permission-matrix.integration.test.ts test/query-budget.integration.test.ts test/analytics-history.integration.test.ts
          bun run --cwd workers/automation test:integration test/comment-policy.integration.test.ts
          node --test scripts/infra/cost-model.test.mjs
          node --test scripts/infra/queue-ops.test.mjs scripts/infra/queue-alert.test.mjs scripts/benchmarks/backend/placement-compare.test.mjs
          bunx --no-install tsc --project scripts/selfhost/tsconfig.json
          bunx --no-install wrangler deploy workers/automation/test-support/queue-capacity.ts --config workers/automation/wrangler.test.jsonc --dry-run --outdir artifacts/queue-capacity-worker
          trap 'rm -f scripts/selfhost/.queue-capacity-check.mjs' EXIT
          bun build scripts/selfhost/queue-capacity-check.ts --target=node --external miniflare --external pg --external effect --external zod --outfile=scripts/selfhost/.queue-capacity-check.mjs
          QUEUE_CAPACITY_BUNDLE=artifacts/queue-capacity-worker/queue-capacity.js node scripts/selfhost/.queue-capacity-check.mjs
      - name: Prepare full gate database
        if: inputs.lane == 'cloudflare-full' || inputs.lane == 'device-authorization' || inputs.lane == 'publishing-queues' || inputs.lane == 'portable-caching' || inputs.lane == 'portable-caching-smoke' || inputs.lane == 'versioned-contract'
        run: bun run setup --skip-dependencies --skip-image-pull
      - name: Exercise every provider connection through real state and persistence

        if: inputs.lane == 'cloudflare-full'
        run: |
          bun run --filter @meltiply/state-worker build
          trap 'rm -f scripts/selfhost/.oauth-connection-check.mjs' EXIT
          bunx --no-install tsc --project scripts/selfhost/tsconfig.json
          bun build scripts/selfhost/oauth-connection-check.ts --target=node \
            --external miniflare --external pg --external effect --external zod \
            --outfile=scripts/selfhost/.oauth-connection-check.mjs
          node scripts/selfhost/.oauth-connection-check.mjs
      - name: Validate complete application contract
        if: inputs.lane == 'cloudflare-full' || inputs.lane == 'device-authorization' || inputs.lane == 'publishing-queues' || inputs.lane == 'portable-caching' || inputs.lane == 'versioned-contract'
        run: bun run cloudflare:check
      - name: Exercise versioned release artifacts and public health
        if: inputs.lane == 'versioned-contract'
        run: |
          bun run release:test
          bun run contract:release:artifacts
          node packages/contracts/scripts/contract-smoke.mjs
          bun run docs:links
      - name: Observe cold, warm, concurrent, and lifecycle cache behavior in workerd
        if: inputs.lane == 'portable-caching' || inputs.lane == 'portable-caching-smoke'
        env:
          API_BASE_URL: http://127.0.0.1:8787
          APP_URL: http://127.0.0.1:3000
        run: |
          ./scripts/cloudflare-local/compose.sh exec -T postgres psql -U postgres -d meltiply -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          ./scripts/cloudflare-local/compose.sh restart postgres
          ./scripts/cloudflare-local/compose.sh up -d --wait postgres
          bun run --cwd frontend/app --no-install playwright install --with-deps chromium
          bun run --cwd frontend/app build:production
          bunx --no-install tsc --project scripts/selfhost/tsconfig.json
          bunx --no-install wrangler deploy workers/api/test-support/requirements-smoke.ts --config workers/api/wrangler.test.jsonc --dry-run --outdir artifacts/cache-provider-worker
          trap 'rm -f scripts/selfhost/.requirements-cache-check.mjs' EXIT
          bun build scripts/selfhost/requirements-cache-check.ts --target=node --external miniflare --external pg --outfile=scripts/selfhost/.requirements-cache-check.mjs
          REQUIREMENTS_SMOKE_BUNDLE=artifacts/cache-provider-worker/requirements-smoke.js node scripts/selfhost/.requirements-cache-check.mjs
          node scripts/benchmarks/backend/cache-runtime-check.mjs
      - name: Verify managed review guidance
        if: inputs.lane == 'portable-caching' || inputs.lane == 'portable-caching-smoke'
        run: |
          bun run skills:check
          bun run docs:links
      - name: Check changed React code diagnostics
        if: inputs.lane == 'portable-caching' || inputs.lane == 'portable-caching-smoke'
        run: npx --yes react-doctor@0.9.18 frontend/app --verbose --scope changed --base origin/${{ github.event.repository.default_branch }}
      - name: Start fresh device authorization acceptance database
        if: inputs.lane == 'device-authorization'
        # Integration suites deliberately exhaust fixture quotas and browser
        # acceptance must start from the deterministic seed.
        run: bash scripts/cloudflare-local/database.sh reset
      - name: Install device authorization browser
        if: inputs.lane == 'device-authorization'
        run: bun run --cwd frontend/app --no-install playwright install --with-deps chromium
      - name: Review changed device authorization React code
        if: inputs.lane == 'device-authorization'
        working-directory: frontend/app
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}
          npx --yes react-doctor@0.9.18 --verbose --scope changed --base origin/${{ github.event.repository.default_branch }}
      - name: Start real device authorization stack
        if: inputs.lane == 'device-authorization'
        env:
          APP_URL: http://127.0.0.1:3000
          WRANGLER_DEV_ALLOWED_ORIGINS: http://127.0.0.1:3000
          WRANGLER_DEV_APP_URL: http://127.0.0.1:3000
          WRANGLER_DEV_ENABLE_CONTAINERS: "false"
        run: |
          mkdir -p artifacts/device-auth
          # Build with the loopback application origin so the preview Worker
          # proxies /api/* to the local API origin instead of a deployed service
          # binding. The full gate's build has no APP_URL and is not reusable.
          bun run --cwd frontend/app build:production
          setsid ./scripts/cloudflare-local/dev-backend.sh >artifacts/device-auth/backend.log 2>&1 &
          echo $! > "$RUNNER_TEMP/device-backend.pid"
          setsid bun run --cwd frontend/app --no-install vp preview --host 127.0.0.1 --port 3000 --strictPort >artifacts/device-auth/frontend.log 2>&1 &
          echo $! > "$RUNNER_TEMP/device-frontend.pid"
          backend_ready=false
          for _ in $(seq 1 180); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/api/v1/health >/dev/null 2>&1; then backend_ready=true; break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/device-backend.pid")" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$backend_ready" != true ]; then
            cat artifacts/device-auth/backend.log >&2
            exit 1
          fi
          frontend_ready=false
          for _ in $(seq 1 120); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/ >/dev/null 2>&1; then frontend_ready=true; break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/device-frontend.pid")" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$frontend_ready" != true ]; then
            cat artifacts/device-auth/frontend.log >&2
            exit 1
          fi
      - name: Exercise device consent and CLI browser independence
        if: inputs.lane == 'device-authorization'
        env:
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
          MELTIPLY_E2E_API_BASE_URL: http://127.0.0.1:8787
          MELTIPLY_E2E_REUSE_SERVERS: "1"
        run: bun run --cwd frontend/app test:e2e e2e/device-consent.spec.ts --project chromium
      - name: Exercise the CLI device protocol against the running installation
        if: inputs.lane == 'device-authorization'
        run: |
          cat > "$RUNNER_TEMP/device-auth-smoke.mjs" <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { setTimeout } from "node:timers/promises";

          // Real runtime smoke against the proxied application origin and the
          // production-composed Worker/Better Auth/PostgreSQL stack. The script
          // exists only for this hosted step; no credential or device code is
          // printed or uploaded.
          const origin = "http://127.0.0.1:3000";
          const email = "gamma@meltiply.local";
          const password = "MeltiplyLocal1!";
          const ip = "2001:db8:aca1::51";
          const json = async (response) => JSON.parse(await response.text());
          const headers = (extra = {}) => ({
            "cf-connecting-ip": ip,
            "content-type": "application/json",
            Origin: origin,
            ...extra,
          });
          const post = (path, body, extra = {}) =>
            fetch(`${origin}${path}`, {
              body: JSON.stringify(body),
              headers: headers(extra),
              method: "POST",
            });

          const codeResponse = await post("/api/auth/device/code", { client_id: "melti-cli" });
          assert.equal(codeResponse.status, 200, "device code issuance must succeed");
          assert.match(codeResponse.headers.get("cache-control") ?? "", /no-store/);
          const code = await json(codeResponse);
          assert.equal(typeof code.device_code, "string");
          assert.equal(typeof code.user_code, "string");
          assert.equal(code.expires_in, 600);
          assert.equal(code.interval, 5);
          assert.equal(new URL(code.verification_uri).origin, origin);
          assert.ok(!code.verification_uri_complete.includes(code.device_code));

          const signIn = await post("/api/auth/sign-in/email", { email, password, clientChannel: "cli" });
          assert.equal(signIn.status, 200, "fixture sign-in must succeed");
          const cookie = signIn.headers
            .getSetCookie()
            .map((entry) => entry.split(";")[0])
            .filter(Boolean)
            .join("; ");
          assert.ok(cookie.includes("session_token"), "sign-in must set a session cookie");

          const verify = await fetch(
            `${origin}/api/auth/device?user_code=${encodeURIComponent(code.user_code)}`,
            { headers: headers({ Cookie: cookie }) },
          );
          assert.equal(verify.status, 200, "browser verification must claim the request");
          const review = await json(verify);
          assert.equal(review.status, "pending");
          assert.equal(review.client_id, "melti-cli");

          const approve = await post(
            "/api/auth/device/approve",
            { userCode: code.user_code },
            { Cookie: cookie },
          );
          assert.equal(approve.status, 200, "explicit approval must succeed");

          const tokenResponse = await post("/api/auth/device/token", {
            client_id: "melti-cli",
            device_code: code.device_code,
            grant_type: "urn:ietf:params:oauth:grant-type:device_code",
          });
          assert.equal(tokenResponse.status, 200, "approved token redemption must succeed");
          const token = await json(tokenResponse);
          assert.equal(token.token_type, "Bearer");
          assert.equal(typeof token.access_token, "string");

          const session = await fetch(`${origin}/api/auth/get-session`, {
            headers: headers({ Authorization: `Bearer ${token.access_token}` }),
          });
          assert.equal(session.status, 200, "CLI session transport must resolve");
          const sessionBody = await json(session);
          assert.equal(sessionBody.user.email, email);
          const jwt = session.headers.get("set-auth-jwt");
          assert.ok(jwt, "get-session must expose the short-lived API JWT");

          const cliRequestId = `provenance-cli-${crypto.randomUUID()}`;
          const authorized = await fetch(`${origin}/api/v1/posts`, {
            headers: headers({
              Authorization: `Bearer ${jwt}`,
              "X-Request-ID": cliRequestId,
              "X-Client-Channel": "web",
              "User-Agent": "Mozilla/5.0",
            }),
          });
          assert.equal(authorized.status, 200, "the CLI JWT must authorize the core API");
          const rawCredential = await fetch(`${origin}/api/v1/posts`, {
            headers: headers({ Authorization: `Bearer ${token.access_token}` }),
          });
          assert.equal(rawCredential.status, 401, "the raw session credential must not authorize");

          const signOut = await fetch(`${origin}/api/auth/sign-out`, {
            body: "{}",
            headers: headers({ Authorization: `Bearer ${token.access_token}` }),
            method: "POST",
          });
          assert.equal(signOut.status, 200, "CLI sign-out must revoke its session");
          const revoked = await fetch(`${origin}/api/auth/get-session`, {
            headers: headers({ Authorization: `Bearer ${token.access_token}` }),
          });
          assert.equal(revoked.status, 200);
          assert.equal(await json(revoked), null, "the revoked CLI session must be unusable");
          const revokedRequestId = `provenance-revoked-${crypto.randomUUID()}`;
          const revokedJwt = await fetch(`${origin}/api/v1/posts`, {
            headers: headers({
              Authorization: `Bearer ${jwt}`,
              "X-Request-ID": revokedRequestId,
              "X-Client-Channel": "cli",
            }),
          });
          assert.equal(revokedJwt.status, 401, "the minted JWT must fail after revocation");

          const browserSession = await fetch(`${origin}/api/auth/get-session`, {
            headers: headers({ Cookie: cookie }),
          });
          assert.equal(browserSession.status, 200);
          const browserBody = await json(browserSession);
          assert.equal(
            browserBody.user.email,
            email,
            "CLI sign-out must not revoke the approving browser session",
          );
          const browserJwt = browserSession.headers.get("set-auth-jwt");
          assert.ok(browserJwt, "browser session must mint an API JWT");
          const webRequestId = `provenance-web-${crypto.randomUUID()}`;
          const webRequest = await fetch(`${origin}/api/v1/users/me`, {
            headers: headers({
              Authorization: `Bearer ${browserJwt}`,
              "X-Request-ID": webRequestId,
              "X-Client-Channel": "cli",
              "User-Agent": "melti-cli/spoof",
            }),
          });
          assert.equal(webRequest.status, 200, "browser JWT must authorize");
          const profile = await json(webRequest);

          // Observe the actual Worker stdout, not a mocked logger. Wrangler may
          // prefix a console line; only its JSON payload is decoded. Wait for
          // the three correlated request records to flush before asserting.
          const requestIds = [webRequestId, cliRequestId, revokedRequestId];
          const records = new Map();
          for (let attempt = 0; attempt < 50 && records.size < requestIds.length; attempt++) {
            const stdout = await readFile("artifacts/device-auth/backend.log", "utf8");
            for (const line of stdout.split("\n")) {
              if (!requestIds.some((id) => line.includes(id))) continue;
              try {
                const record = JSON.parse(line.slice(line.indexOf("{")));
                if (record.context?.event === "http_request" && requestIds.includes(record.request_id))
                  records.set(record.request_id, record.context);
              } catch {
                // Non-JSON Wrangler status lines are not request evidence.
              }
            }
            if (records.size < requestIds.length) await setTimeout(100);
          }
          for (const [id, channel, sessionId] of [
            [webRequestId, "web", browserBody.session.id],
            [cliRequestId, "cli", sessionBody.session.id],
          ]) {
            const context = records.get(id);
            assert.ok(context, `missing ${channel} request log`);
            assert.equal(context.client_channel, channel);
            assert.equal(context.auth_method, "session_jwt");
            assert.equal(context.actor_id, profile.id);
            assert.equal(context.credential_id, sessionId);
          }
          const revokedContext = records.get(revokedRequestId);
          assert.ok(revokedContext, "missing rejected request log");
          assert.equal(revokedContext.client_channel, "unknown");
          assert.equal(revokedContext.auth_method, "unknown");
          assert.ok(!("actor_id" in revokedContext));
          assert.ok(!("credential_id" in revokedContext));
          const serialized = JSON.stringify([...records.values()]);
          for (const secret of [jwt, browserJwt, token.access_token, code.device_code, cookie])
            assert.ok(!serialized.includes(secret), "request provenance logs must not contain credentials");

          console.log(
            "device-auth smoke: lifecycle, server-stored web/CLI provenance, safe request logs, and revocation verified",
          );
          NODE
          node "$RUNNER_TEMP/device-auth-smoke.mjs"
          rm -f "$RUNNER_TEMP/device-auth-smoke.mjs"
      - name: Stop device authorization stack
        if: always() && inputs.lane == 'device-authorization'
        run: |
          if [ -f "$RUNNER_TEMP/device-frontend.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/device-frontend.pid")"
            kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/device-frontend.pid"
          fi
          if [ -f "$RUNNER_TEMP/device-backend.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/device-backend.pid")"
            kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/device-backend.pid"
          fi
      - name: Start fresh browser acceptance database
        # The complete application gate deliberately exercises ownership
        # transfer, suspension, and quota-boundary fixtures. Browser acceptance
        # needs the deterministic seed, not the gate's exhausted state.
        if: inputs.lane == 'cloudflare-full'
        run: bash scripts/cloudflare-local/database.sh reset
      - name: Exercise navigation focus and reconnect assignment in the browser
        if: inputs.lane == 'cloudflare-full'
        env:
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
          MELTIPLY_E2E_ACCEPTANCE: "1"
        run: |
          bun run --cwd frontend/app --no-install playwright install --with-deps chromium
          bun run --cwd frontend/app test:e2e e2e/workspace-design.spec.ts --project workspace \
            --grep "keeps navigation focus and reconnect assignment correct" --trace on
      - uses: actions/setup-go@v6
        if: inputs.lane == 'object-storage'
        with:
          go-version: "1.26"
          cache: false
      - name: Check storage types and focused scenarios
        if: inputs.lane == 'object-storage'
        run: |
          bun run --filter @meltiply/storage type-check
          bunx --no-install tsc --project scripts/selfhost/tsconfig.json
          bun run --cwd packages/storage test test/s3.test.ts test/provider.test.ts --coverage.enabled=false
      - name: Exercise S3-compatible storage against MinIO
        if: inputs.lane == 'object-storage'
        env:
          S3_CHECK_ENDPOINT: http://127.0.0.1:9000
        run: |
          git clone --depth 1 --branch RELEASE.2025-04-22T22-12-26Z https://github.com/minio/minio.git "$RUNNER_TEMP/minio"
          go build -C "$RUNNER_TEMP/minio" -o "$RUNNER_TEMP/minio-server" .
          MINIO_ROOT_USER=s3-check-access-key MINIO_ROOT_PASSWORD=s3-check-secret-key \
            "$RUNNER_TEMP/minio-server" server "$RUNNER_TEMP/storage-check" >"$RUNNER_TEMP/minio.log" 2>&1 &
          minio_pid=$!
          echo "$minio_pid" >"$RUNNER_TEMP/storage-check.pid"
          minio_ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then minio_ready=true; break; fi
            if ! kill -0 "$minio_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$minio_ready" != true ]; then
            echo "MinIO did not report healthy within 60s" >&2
            cat "$RUNNER_TEMP/minio.log" >&2
            exit 1
          fi
          bun run storage:s3:check
      - name: Validate complete application gate
        if: inputs.lane == 'object-storage'
        run: |
          ./scripts/cloudflare-local/compose.sh up -d postgres
          env -u MELTIPLY_DEV_TUNNEL bun run cloudflare:check
          bun run release:test
      - name: Exercise provider switching through application lifecycle
        if: inputs.lane == 'object-storage'
        env:
          S3_CHECK_ENDPOINT: http://127.0.0.1:9000
          PROCESSOR_JOB_TOKEN: storage-check-private-native-engine-token
          PROCESSOR_PORT: "8082"
          S3_CHECK_IMAGE: ${{ runner.temp }}/storage-check.png
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvips-tools
          ffmpeg -v error -f lavfi -i color=c=blue:s=640x640 -frames:v 1 "$S3_CHECK_IMAGE"
          node workers/automation/processor/engine/server.mjs >"$RUNNER_TEMP/processor.log" 2>&1 &
          processor_pid=$!
          trap 'kill "$processor_pid"; rm -f scripts/selfhost/.storage-pipeline-check.mjs' EXIT
          processor_ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8082/healthz; then processor_ready=true; break; fi
            if ! kill -0 "$processor_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$processor_ready" != true ]; then
            echo "Processor did not report healthy within 60s" >&2
            cat "$RUNNER_TEMP/processor.log" >&2
            exit 1
          fi
          # Miniflare transfers R2 body streams between threads; this needs Node, not Bun.
          bun build scripts/selfhost/storage-pipeline-check.ts --target=node \
            --external miniflare --external pg --external effect --external zod \
            --outfile=scripts/selfhost/.storage-pipeline-check.mjs
          node scripts/selfhost/.storage-pipeline-check.mjs
      - name: Stop object storage origin
        if: always() && inputs.lane == 'object-storage'
        run: |
          if [ -f "$RUNNER_TEMP/storage-check.pid" ]; then kill "$(cat "$RUNNER_TEMP/storage-check.pid")"; fi
          mkdir -p artifacts/storage
          cp "$RUNNER_TEMP/minio.log" "$RUNNER_TEMP/processor.log" artifacts/storage/ 2>/dev/null || true
      - name: Validate release, infrastructure, and dependency policies
        if: inputs.lane == 'cloudflare-extended'
        run: |
          bun run release:test
          bun run test:staging
          bun run test:supply-chain
          bun run security:supply-chain
          bun run iac:check
      - name: Exercise Worker-native local topology and load
        if: inputs.lane == 'cloudflare-integration'
        run: |
          bun run setup --skip-dependencies --skip-image-pull
          bun run test:integration
          timeout --signal=TERM --kill-after=30s 180s bun run local:smoke
          mkdir -p artifacts/performance
          setsid ./scripts/cloudflare-local/dev-backend.sh >artifacts/performance/k6-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill -TERM -- "-$backend_pid" 2>/dev/null || true' EXIT
          bun run local:k6:ci
      - name: Review changed UI and required frontend gates
        if: inputs.lane == 'frontend-ui'
        run: |
          cd frontend/app
          git fetch origin ${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}
          npx --yes react-doctor@0.9.18 --verbose --scope changed --base origin/${{ github.event.repository.default_branch }}
          cd ../..
          bun run lint:dead
          bun run --filter frontend-app check
          bun run --filter frontend-public check
          bun run docs:links
      - name: Prepare focused UI browser journey
        if: inputs.lane == 'frontend-ui'
        run: |
          bun run setup --skip-dependencies --skip-image-pull
          bun run --cwd frontend/app --no-install playwright install --with-deps chromium
      - name: Start fresh Queue acceptance database
        if: inputs.lane == 'publishing-queues'
        # Integration suites deliberately exercise exhausted quotas. Browser
        # acceptance starts with fresh seeded data, never relaxed production limits.
        run: bash scripts/cloudflare-local/database.sh reset
      - name: Install Queue acceptance browser
        if: inputs.lane == 'publishing-queues'
        run: bun run --cwd frontend/app --no-install playwright install --with-deps chromium
      - name: Review Queue React changes
        if: inputs.lane == 'publishing-queues'
        working-directory: frontend/app
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}
          npx --yes react-doctor@0.9.14 --verbose --scope changed --base origin/${{ github.event.repository.default_branch }}
      - name: Exercise durable Queue publishing
        if: inputs.lane == 'publishing-queues'
        env:
          MELTIPLY_E2E_ACCEPTANCE: "1"
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
        run: bun run --cwd frontend/app test:e2e e2e/publishing-queues.spec.ts --project queues --trace on
      - name: Smoke development stylesheet and self-hosted fonts
        if: inputs.lane == 'frontend-ui'
        run: |
          mkdir -p artifacts
          setsid bun run --cwd frontend/app dev --host 127.0.0.1 --port 3011 --strictPort >artifacts/frontend-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill -TERM -- "-$dev_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { setTimeout } from "node:timers/promises";
          const origin = "http://127.0.0.1:3011";
          let response;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              response = await fetch(`${origin}/src/app/globals.css?direct`);
              break;
            } catch {
              await setTimeout(1000);
            }
          }
          assert(response, "Development server did not become reachable");
          const css = await response.text();
          assert.equal(response.status, 200, css);
          const fonts = [...css.matchAll(/url\(["']?([^"')]*geist[^"')]*\.woff2[^"')]*)["']?\)/g)];
          assert.equal(fonts.length, 4, "Stylesheet must resolve all four self-hosted Geist faces");
          for (const [, path] of fonts) {
            const font = await fetch(new URL(path, origin));
            assert.equal(font.status, 200, `Font request failed: ${path}`);
            const bytes = new Uint8Array(await font.arrayBuffer());
            assert.deepEqual([...bytes.slice(0, 4)], [0x77, 0x4f, 0x46, 0x32], `Invalid WOFF2 response: ${path}`);
            console.log(`Loaded development font: ${path}`);
          }
          NODE
      - name: Validate frontend and install Chromium
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        run: |
          bun run format-check
          bun run type-check
          bun run cf-typegen:check
          bun run lint
          bun run audit
          bun run test --coverage
          bun run --cwd ../.. setup --skip-dependencies --skip-image-pull
          bun run --no-install playwright install --with-deps chromium
      - name: Exercise real browser journeys
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        env:
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
        run: |
          bun run test:e2e --trace on
          MELTIPLY_E2E_ACCEPTANCE=1 bun run test:e2e e2e/posts-composer.spec.ts --project composer --grep "recovers independent profile copies and retries only unfinished publishing" --trace on
      - name: Exercise redesigned workspace and public pages
        if: inputs.lane == 'frontend-ui'
        env:
          MELTIPLY_DATABASE_TEST_ADMIN_URL: postgres://postgres:meltiply-admin-local@127.0.0.1:5433/meltiply?sslmode=disable
          MELTIPLY_E2E_PUBLIC_URL: http://127.0.0.1:4321
          MELTIPLY_E2E_ACCEPTANCE: "1"
        run: |
          bun run --cwd frontend/public preview --host 127.0.0.1 --port 4321 &
          public_pid=$!
          trap 'kill "$public_pid" 2>/dev/null || true' EXIT
          bun run --cwd frontend/app test:e2e e2e/workspace-design.spec.ts e2e/analytics.spec.ts e2e/public-site.spec.ts --project workspace --trace on
      - name: Inspect UI design mechanics
        if: inputs.lane == 'frontend-ui'
        run: node .agents/skills/impeccable/scripts/detect.mjs --json frontend/app/src/components/layout frontend/app/src/components/primitives/sidebar-nav.tsx frontend/shared/tokens.css frontend/public/src/styles
      - name: Check production performance without rebuilding
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        env:
          WRANGLER_DEV_ALLOWED_ORIGINS: http://127.0.0.1:3000
          WRANGLER_DEV_APP_URL: http://127.0.0.1:3000
        run: |
          mkdir -p ../../artifacts/performance
          # The production preview proxies /api/* to the local Worker. Measure a
          # working application, not a preview whose auth reads fail with 502.
          setsid ../../scripts/cloudflare-local/dev-backend.sh >../../artifacts/performance/backend.log 2>&1 &
          backend_pid=$!
          # Cloudflare compresses text assets at the edge; the Vite preview does
          # not. Serve the built client with production-like brotli/gzip so the
          # budget measures the application rather than an encoding artifact.
          setsid node ../../scripts/ci/lighthouse-preview.mjs --root dist/client --port 3000 >../../artifacts/performance/preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill -TERM -- "-$preview_pid" 2>/dev/null || true
            kill -TERM -- "-$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          backend_ready=false
          for _ in $(seq 1 180); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/api/v1/health >/dev/null 2>&1; then backend_ready=true; break; fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$backend_ready" != true ]; then
            echo "API did not report healthy within 180s" >&2
            cat ../../artifacts/performance/backend.log >&2
            exit 1
          fi
          preview_ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/posts >/dev/null; then preview_ready=true; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$preview_ready" != true ]; then
            echo "Preview did not report ready within 60s" >&2
            cat ../../artifacts/performance/preview.log >&2
            exit 1
          fi
          ../../scripts/ci/lighthouse.sh http://127.0.0.1:3000/posts ../../artifacts/performance/lighthouse.json
          bun run --cwd ../public check
      - name: Stop owned local services
        if: always() && inputs.lane != 'cloudflare-extended'
        run: ./scripts/cloudflare-local/teardown.sh
      - name: Preserve diagnostic and policy evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extended-${{ inputs.lane }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/
            frontend/app/playwright-report/
            frontend/app/test-results/
