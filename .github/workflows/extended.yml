name: Extended checks

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Additional hosted validation
        required: true
        type: choice
        options:
          - frontend-full
          - cloudflare-integration
          - cloudflare-extended
          - object-storage

permissions:
  contents: read

concurrency:
  group: extended-${{ inputs.lane }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  MELTIPLY_DEV_TUNNEL: "0"

jobs:
  check:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - uses: actions/setup-go@v6
        if: inputs.lane == 'object-storage'
        with:
          go-version: "1.26"
          cache: false
      - name: Check storage types and focused scenarios
        if: inputs.lane == 'object-storage'
        run: |
          bun run --filter @meltiply/storage type-check
          bunx --no-install tsc --project scripts/selfhost/tsconfig.json
          bun run --cwd packages/storage test test/s3.test.ts test/provider.test.ts --coverage.enabled=false
      - name: Exercise S3-compatible storage against MinIO
        if: inputs.lane == 'object-storage'
        env:
          S3_CHECK_ENDPOINT: http://127.0.0.1:9000
        run: |
          git clone --depth 1 --branch RELEASE.2025-04-22T22-12-26Z https://github.com/minio/minio.git "$RUNNER_TEMP/minio"
          go build -C "$RUNNER_TEMP/minio" -o "$RUNNER_TEMP/minio-server" .
          MINIO_ROOT_USER=s3-check-access-key MINIO_ROOT_PASSWORD=s3-check-secret-key \
            "$RUNNER_TEMP/minio-server" server "$RUNNER_TEMP/storage-check" >"$RUNNER_TEMP/minio.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/storage-check.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 1
          done
          bun run storage:s3:check
      - name: Validate complete application gate
        if: inputs.lane == 'object-storage'
        run: |
          ./scripts/cloudflare-local/compose.sh up -d postgres
          env -u MELTIPLY_DEV_TUNNEL bun run cloudflare:check
          bun run release:test
      - name: Exercise provider switching through application lifecycle
        if: inputs.lane == 'object-storage'
        env:
          S3_CHECK_ENDPOINT: http://127.0.0.1:9000
          PROCESSOR_JOB_TOKEN: storage-check-private-native-engine-token
          PROCESSOR_PORT: "8082"
          S3_CHECK_IMAGE: ${{ runner.temp }}/storage-check.png
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvips-tools
          ffmpeg -v error -f lavfi -i color=c=blue:s=640x640 -frames:v 1 "$S3_CHECK_IMAGE"
          node workers/automation/processor/engine/server.mjs >"$RUNNER_TEMP/processor.log" 2>&1 &
          processor_pid=$!
          trap 'kill "$processor_pid"; rm -f scripts/selfhost/.storage-pipeline-check.mjs' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8082/healthz; then break; fi
            sleep 1
          done
          # Miniflare transfers R2 body streams between threads; this needs Node, not Bun.
          bun build scripts/selfhost/storage-pipeline-check.ts --target=node \
            --external miniflare --external pg --external effect --external zod \
            --outfile=scripts/selfhost/.storage-pipeline-check.mjs
          node scripts/selfhost/.storage-pipeline-check.mjs
      - name: Stop object storage origin
        if: always() && inputs.lane == 'object-storage'
        run: |
          if [ -f "$RUNNER_TEMP/storage-check.pid" ]; then kill "$(cat "$RUNNER_TEMP/storage-check.pid")"; fi
          mkdir -p artifacts/storage
          cp "$RUNNER_TEMP/minio.log" "$RUNNER_TEMP/processor.log" artifacts/storage/ 2>/dev/null || true
      - name: Validate release, infrastructure, and dependency policies
        if: inputs.lane == 'cloudflare-extended'
        run: |
          bun run release:test
          bun run test:staging
          bun run test:supply-chain
          bun run security:supply-chain
          bun run iac:check
      - name: Exercise Worker-native local topology and load
        if: inputs.lane == 'cloudflare-integration'
        run: |
          bun run setup --skip-dependencies --skip-image-pull
          bun run test:integration
          timeout --signal=TERM --kill-after=30s 180s bun run local:smoke
          mkdir -p artifacts/performance
          setsid ./scripts/cloudflare-local/dev-backend.sh >artifacts/performance/k6-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill -TERM -- "-$backend_pid" 2>/dev/null || true' EXIT
          bun run local:k6:ci
      - name: Validate frontend and install Chromium
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        run: |
          bun run format-check
          bun run type-check
          bun run cf-typegen:check
          bun run lint
          bun run audit
          bun run test --coverage
          bun run --cwd ../.. setup --skip-dependencies --skip-image-pull
          bun run --no-install playwright install --with-deps chromium
      - name: Exercise real browser journeys
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        run: bun run test:e2e --trace on
      - name: Check production performance without rebuilding
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        run: |
          setsid bun run --no-install vp preview --host 127.0.0.1 --port 3000 --strictPort >/tmp/meltiply-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill -TERM -- "-$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/posts >/dev/null; then break; fi
            kill -0 "$preview_pid"
            sleep 1
          done
          ../../scripts/ci/lighthouse.sh http://127.0.0.1:3000/posts ../../artifacts/performance/lighthouse.json
          bun run --cwd ../public check
      - name: Stop owned local services
        if: always() && inputs.lane != 'cloudflare-extended'
        run: ./scripts/cloudflare-local/teardown.sh
      - name: Preserve diagnostic and policy evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extended-${{ inputs.lane }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/
            frontend/app/playwright-report/
            frontend/app/test-results/
