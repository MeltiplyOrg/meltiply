name: Extended checks

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Additional hosted validation
        required: true
        type: choice
        options:
          - frontend-full
          - cloudflare-integration
          - cloudflare-extended
          - auth-acceptance

permissions:
  contents: read

concurrency:
  group: extended-${{ inputs.lane }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  MELTIPLY_DEV_TUNNEL: "0"

jobs:
  check:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-workspace
      - name: Prepare generated auth contracts and formatting
        if: inputs.lane == 'auth-acceptance'
        run: |
          bun run contract:generate
          bun run contract:readiness:generate
          bunx --no-install vp fmt frontend/app packages/auth packages/contracts workers/api scripts/selfhost .github/workflows/extended.yml .github/workflows/selfhost-ci.yml
          mkdir -p artifacts/auth-prepared
          git diff --name-only -z --diff-filter=ACM HEAD | tar --null -T - -czf artifacts/auth-prepared/prepared.tar.gz
      - name: Check changed React surfaces
        if: inputs.lane == 'auth-acceptance'
        run: npx --yes react-doctor@latest --verbose --scope changed
      - name: Run comprehensive application gate
        if: inputs.lane == 'auth-acceptance'
        run: |
          ./scripts/cloudflare-local/compose.sh up -d postgres
          bun run cloudflare:check
      - name: Exercise first-run owner journeys in production images
        if: inputs.lane == 'auth-acceptance'
        env:
          SELFHOST_IMAGE_PREFIX: local/meltiply
          SELFHOST_IMAGE_TAG: auth-check
          COMPOSE_PARALLEL_LIMIT: "1"
        run: |
          bun run --cwd frontend/app --no-install playwright install --with-deps chromium
          node scripts/selfhost/configure.mjs --ci
          docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile verification build
          docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile verification up -d --wait --wait-timeout 240
          node scripts/selfhost/smoke.mjs
      - name: Stop owner acceptance deployment
        if: always() && inputs.lane == 'auth-acceptance'
        run: |
          if test -f .env.selfhost; then
            docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile verification down --volumes --remove-orphans
          fi
      - name: Validate release, infrastructure, and dependency policies
        if: inputs.lane == 'cloudflare-extended'
        run: |
          bun run release:test
          bun run test:staging
          bun run test:supply-chain
          bun run security:supply-chain
          bun run iac:check
      - name: Exercise Worker-native local topology and load
        if: inputs.lane == 'cloudflare-integration'
        run: |
          bun run setup --skip-dependencies --skip-image-pull
          bun run test:integration
          timeout --signal=TERM --kill-after=30s 180s bun run local:smoke
          mkdir -p artifacts/performance
          setsid ./scripts/cloudflare-local/dev-backend.sh >artifacts/performance/k6-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill -TERM -- "-$backend_pid" 2>/dev/null || true' EXIT
          bun run local:k6:ci
      - name: Validate frontend and install Chromium
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        run: |
          bun run format-check
          bun run type-check
          bun run cf-typegen:check
          bun run lint
          bun run audit
          bun run test --coverage
          bun run --cwd ../.. setup --skip-dependencies --skip-image-pull
          bun run --no-install playwright install --with-deps chromium
      - name: Exercise real browser journeys
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        run: bun run test:e2e --trace on
      - name: Check production performance without rebuilding
        if: inputs.lane == 'frontend-full'
        working-directory: frontend/app
        run: |
          setsid bun run --no-install vp preview --host 127.0.0.1 --port 3000 --strictPort >/tmp/meltiply-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill -TERM -- "-$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/posts >/dev/null; then break; fi
            kill -0 "$preview_pid"
            sleep 1
          done
          ../../scripts/ci/lighthouse.sh http://127.0.0.1:3000/posts ../../artifacts/performance/lighthouse.json
          bun run --cwd ../public check
      - name: Stop owned local services
        if: always() && inputs.lane != 'cloudflare-extended'
        run: ./scripts/cloudflare-local/teardown.sh
      - name: Preserve diagnostic and policy evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extended-${{ inputs.lane }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/
            frontend/app/playwright-report/
            frontend/app/test-results/
