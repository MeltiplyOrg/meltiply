name: Self-hosted image checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  COMPOSE_PARALLEL_LIMIT: "1"
  SELFHOST_IMAGE_TAG: ci

jobs:
  build:
    name: Build ${{ matrix.image.component }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        image:
          - { component: runtime, context: ., file: scripts/selfhost/Dockerfile, target: runtime }
          - { component: database, context: ., file: scripts/selfhost/Dockerfile, target: database }
          - {
              component: processor,
              context: workers/automation/processor,
              file: workers/automation/processor/Dockerfile,
              target: "",
            }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Select lowercase image namespace
        run: echo "SELFHOST_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build production image without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: PROCESSOR_PLATFORM=linux/${{ matrix.platform.arch }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/selfhost-${{ matrix.image.component }}-${{ matrix.platform.arch }}.tar
          tags: ${{ env.SELFHOST_IMAGE_PREFIX }}-${{ matrix.image.component }}:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=selfhost-${{ matrix.image.component }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=selfhost-${{ matrix.image.component }}-${{ matrix.platform.arch }}
      - name: Compress built image for exact-image verification
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/selfhost-${{ matrix.image.component }}-${{ matrix.platform.arch }}.tar
        run: zstd -T0 -3 --rm "$IMAGE_ARCHIVE"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: selfhost-image-${{ matrix.image.component }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selfhost-${{ matrix.image.component }}-${{ matrix.platform.arch }}.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: Smoke production Compose (${{ matrix.platform.arch }})
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      SELFHOST_PLATFORM: linux/${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@v8
        with:
          pattern: selfhost-image-*-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selfhost-images
          merge-multiple: true
      - name: Load the exact built images
        env:
          IMAGE_DIRECTORY: ${{ runner.temp }}/selfhost-images
          IMAGE_ARCH: ${{ matrix.platform.arch }}
        run: |
          for component in runtime database processor; do
            zstd --decompress --stdout "$IMAGE_DIRECTORY/selfhost-$component-$IMAGE_ARCH.tar.zst" | docker load
          done
          echo "SELFHOST_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          node scripts/selfhost/configure.mjs --ci
      - name: Validate durable broker behavior
        run: docker run --rm -v "$PWD/scripts/selfhost/jobs.test.mjs:/app/scripts/selfhost/jobs.test.mjs:ro" --entrypoint node "${SELFHOST_IMAGE_PREFIX}-runtime:ci" --test scripts/selfhost/jobs.test.mjs
      - name: Start complete production deployment
        run: |
          docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile verification config --quiet
          docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile verification up -d --no-build --wait --wait-timeout 240
      - uses: ./.github/actions/install-workspace
      - name: Install Chromium for real owner journeys
        working-directory: frontend/app
        run: bun run --no-install playwright install --with-deps chromium
      - name: Exercise application, email, storage, jobs, workflows, and crash recovery
        run: node scripts/selfhost/smoke.mjs
      - name: Preserve credential-free login screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: owner-login-${{ matrix.platform.arch }}
          path: artifacts/selfhost/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate and exercise optional TLS ingress
        run: |
          docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile tls run --rm --no-deps gateway caddy validate --config /etc/caddy/Caddyfile
          docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile tls up -d --no-deps gateway
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 10 --insecure --fail --show-error --silent https://localhost/api/v1/ready
      - name: Preserve deployment diagnostics
        if: always()
        run: |
          mkdir -p artifacts/selfhost
          docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile verification --profile tls logs --no-color > artifacts/selfhost/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: selfhost-diagnostics-${{ matrix.platform.arch }}
          path: artifacts/selfhost
          retention-days: 7
      - name: Stop owned deployment
        if: always()
        run: docker compose --env-file .env.selfhost -f compose.selfhost.yml --profile verification --profile tls down --volumes --remove-orphans
