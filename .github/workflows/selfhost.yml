name: Self-hosted images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified images to GHCR
        type: boolean
        default: false
      tag:
        description: Image tag for a manual publication
        type: string
        default: manual

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/selfhost-images
      - uses: ./.github/actions/install-workspace
      - name: Check the complete existing Cloudflare deployment target
        run: |
          bun run setup --skip-dependencies --skip-image-pull
          bun run cloudflare:check
          bun run docs:links
          bunx --no-install vp fmt scripts/selfhost compose.selfhost.yml .github/workflows/selfhost.yml .github/actions/selfhost-images/action.yml knip.json README.md docs/self-hosting.md docs/public-ci.md --check
      - name: Publish only verified images
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid image tag' >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in runtime database processor; do
            image="${SELFHOST_IMAGE_PREFIX}-${component}"
            docker tag "$image:ci" "$image:$RELEASE_TAG"
            docker push "$image:$RELEASE_TAG"
            docker tag "$image:ci" "$image:sha-$GITHUB_SHA"
            docker push "$image:sha-$GITHUB_SHA"
            if [ "$GITHUB_EVENT_NAME" = release ] && [ "$PRERELEASE" = false ]; then
              docker tag "$image:ci" "$image:latest"
              docker push "$image:latest"
            fi
          done
