[files]
extend-exclude = [".claude", "**/worker-configuration.d.ts", "frontend/app/src/lib/i18n.tsx"]

[default]
# Fumadocs owns the `nd-*` DOM ID prefix; preserve exact quoted selectors and lookups.
extend-ignore-re = ['"(?:#)?nd-[a-z-]*"']

[default.extend-words]
GetDel = "GetDel"
Meltiply = "Meltiply"
presign = "presign"
ratelimit = "ratelimit"
RTO = "RTO"
ba = "ba"
fpr = "fpr"
publicaly = "publicaly"
trak = "trak"
unparseable = "unparseable"

# Preserve upstream legal text verbatim, including its original spelling.
[type.cc-by-license]
extend-glob = ["LICENSES/CC-BY-3.0.txt"]

[type.cc-by-license.extend-words]
MERCHANTIBILITY = "MERCHANTIBILITY"

[type.python-license]
extend-glob = ["LICENSES/python-argparse.txt"]

[type.python-license.extend-words]
Stichting = "Stichting"
Mathematisch = "Mathematisch"
