operations:
  getSetupStatus:
    success:
      status: 200
      body: { initialized: false }
    errors:
      - status: 503
        body: *auth_error
      - status: 429
        body: *rate_limited_error
  resendVerification:
    request: { email: owner@example.test, callbackURL: "https://staging.meltiply.com/sign-in" }
    success:
      status: 200
      body: { status: true }
    errors:
      - status: 400
        body: *auth_error
      - status: 429
        body: *rate_limited_error
  enableTwoFactor:
    headers: *session_cookie
    request: { password: contract-placeholder-not-a-credential }
    success:
      status: 200
      body:
        {
          method: totp,
          totpURI: "otpauth://totp/contract-placeholder",
          backupCodes: [contract-placeholder],
        }
    errors:
      - status: 401
        body: *auth_error
  disableTwoFactor:
    headers: *session_cookie
    request: { password: contract-placeholder-not-a-credential }
    success:
      status: 200
      body: { status: true }
    errors:
      - status: 401
        body: *auth_error
  generateBackupCodes:
    headers: *session_cookie
    request: { password: contract-placeholder-not-a-credential }
    success:
      status: 200
      body: { status: true, backupCodes: [contract-placeholder] }
    errors:
      - status: 401
        body: *auth_error
  verifyTotp:
    request: { code: contract-placeholder, trustDevice: false }
    success:
      status: 200
      body: { token: contract-placeholder, user: *auth_user }
    errors:
      - status: 401
        body: *auth_error
  verifyBackupCode:
    request: { code: contract-placeholder, trustDevice: false }
    success:
      status: 200
      body: { token: contract-placeholder, user: *auth_user }
    errors:
      - status: 401
        body: *auth_error
  getHealth:
    success:
      status: 200
      body:
        status: ok
        version: 1.0.0-target.0
        contract_version: 1.0.0-target.0
        environment: staging
    errors: []
  getReadiness:
    success:
      status: 200
      body:
        status: ready
        components:
          - name: database
            status: ready
    errors:
      - status: 503
        body:
          status: unavailable
          components:
            - name: DB_SYSTEM
              status: unavailable
  signInWithEmail:
    request:
      email: alpha-admin@example.test
      password: meltiply-dummy-secret-not-real
    success:
      status: 200
      headers:
        Set-Cookie: better-auth.session_token=ba_token_alpha_01; Path=/; HttpOnly; SameSite=Lax
      body:
        redirect: false
        token: ba_token_alpha_01
        url: null
        user: *auth_user
    errors:
      - status: 401
        body: *auth_error
      - status: 429
        body: *rate_limited_error
  signUpWithEmail:
    headers:
      X-Setup-Secret: contract-placeholder-not-a-real-setup-secret
    request:
      name: Alpha Admin
      email: alpha-admin@example.test
      password: meltiply-dummy-secret-not-real
    success:
      status: 200
      headers:
        Set-Cookie: better-auth.session_token=ba_token_alpha_01; Path=/; HttpOnly; SameSite=Lax
      body:
        token: ba_token_alpha_01
        user: *auth_user
    errors:
      - status: 400
        body: *auth_error
      - status: 403
        body: *auth_error
      - status: 503
        body: *auth_error
      - status: 429
        body: *rate_limited_error
  signOut:
    headers: *session_cookie
    request: {}
    success:
      status: 200
      headers:
        Set-Cookie: better-auth.session_token=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0
      body:
        success: true
    errors:
      - status: 401
        body: *auth_error
  getAuthSession:
    headers: *session_cookie
    success:
      status: 200
      headers:
        set-auth-jwt: eyJhbGciOiJFZERTQSIsImtpZCI6ImJhLWp3dC1rZXktMDEiLCJ0eXAiOiJKV1QifQ.eyJzdWIiOiJiYV91c2VyX2FscGhhXzAxIiwiZW1haWwiOiJhbHBoYS1hZG1pbkBleGFtcGxlLnRlc3QiLCJhdWQiOiJtZWx0aXBseS1hcGkiLCJleHAiOjE3NjczMTI3MDB9.c2lnbmF0dXJlLWV4YW1wbGUtYmEtc2lnLTAx
      body:
        session: *auth_session
        user: *auth_user
    errors:
      - status: 429
        body: *rate_limited_error
  requestPasswordReset:
    request:
      email: alpha-admin@example.test
      redirectTo: https://staging.meltiply.com/reset-password
