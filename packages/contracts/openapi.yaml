    PlatformCapability:
      type: object
      additionalProperties: false
      required:
        - platform
        - connect_available
        - asset_types
        - publish
        - analytics
        - comments
        - reply
        - max_caption_length
        - max_hashtags
        - max_media_count
        - min_media_count
        - multi_asset_types
        - max_file_size
        - max_video_duration_sec
        - accepted_mime_types
        - notes
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        connect_available:
          type: boolean
        asset_types:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AssetType"
        publish:
          type: boolean
        analytics:
          type: boolean
        comments:
          type: boolean
        reply:
          type: boolean
        max_caption_length:
          type: [integer, "null"]
          minimum: 0
        max_hashtags:
          type: [integer, "null"]
          minimum: 0
        max_media_count:
          type: [integer, "null"]
          minimum: 1
          description: |
            Authoritative per-Platform bound on the number of media
            attachments one target Channel accepts. schedulePost validates
            each target's resolved attachment set against this limit; null
            means the Platform publishes no usable media bound.
        min_media_count:
          type: [integer, "null"]
          minimum: 0
          description: |
            Minimum attachments one target Channel requires to publish. 0
            permits a text-only publication; 1 or more makes media
            mandatory. Text-only permission lives here because AssetType no
            longer enumerates a text kind. null means no usable bound.
        multi_asset_types:
          type: [array, "null"]
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AssetType"
          description: |
            Media kinds permitted inside a publication carrying more than
            one attachment. An empty list (or null) means the Platform
            publishes no multi-attachment composition. schedulePost rejects
            any target whose resolved attachment set violates these bounds
            and reports that Channel without discarding the shared Post.
        max_file_size:
          type: [integer, "null"]
          minimum: 1
        max_video_duration_sec:
          type: [number, "null"]
          minimum: 0
        accepted_mime_types:
          type: array
          uniqueItems: true
          items:
            type: string
        notes:
          type: array
          items:
            type: string
    PlatformCapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/PlatformCapability"
    OAuthStartResponse:
