          description: Post with cancelled pending outcomes and no active Queue membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /posts/{post_id}/schedule:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/XWorkspaceId"
    post:
      tags: [Posts]
      operationId: schedulePost
      summary: Schedule or immediately publish a Post to its target Channels
      description: |
        Resolves every requested or already-saved target into one pending
        Distribution per Post and Platform account, validating each target
        against Platform capabilities and confirmed-ready attachment
        renditions before accepting it. A null scheduled_at publishes
        immediately; otherwise the same time applies to every target. The
        operation atomically creates or updates only still-editable pending
        Distributions and never republishes, mutates, or rewrites an
        already-claimed, published, cancelled, or reconciliation-bound
        outcome; eligible retries go through retryDistribution. Repeating
        the same scheduling intent cannot create a second Post or duplicate
        Distribution row.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePostRequest"
      responses:
        "200":
          description: Post with the updated per-Channel pending outcomes.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
