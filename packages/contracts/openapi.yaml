          description: Active Brand Profile that will own the connected Channel.
    PlatformAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - org_id
        - brand_profile_id
        - platform
        - platform_user_id
        - display_name
        - username
        - avatar_url
        - connection_status
        - token_expires_at
        - last_synced_at
        - scopes
        - capabilities
        - rate_limit_budget
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
