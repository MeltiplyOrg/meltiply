        schema: { type: string, format: uuid }
    delete:
      tags: [Queues]
      operationId: removePostFromQueue
      summary: Cancel editable pending outcomes and release a Queue reservation
      description: |
        Requires Editor or Admin. Refuses in-flight, published, failed, or
        reconciliation-bound work. Does not move other reservations or delete
        Post content, Assets, targets, or Provider settings.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
