        token_expires_at:
          type: [string, "null"]
          format: date-time
        last_synced_at:
          type: [string, "null"]
          format: date-time
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
        capabilities:
          $ref: "#/components/schemas/PlatformCapability"
        rate_limit_budget:
          oneOf:
