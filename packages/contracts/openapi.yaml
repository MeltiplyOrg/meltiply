      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublishingQueue" }
        next_cursor: { type: [string, "null"], format: uuid }
    CreateQueueRequest:
      type: object
      additionalProperties: false
      required: [brand_profile_id, name, timezone, slots]
      properties:
        brand_profile_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: Supported IANA timezone identifier.
        slots:
          type: array
          minItems: 1
          maxItems: 168
          uniqueItems: true
          items: { $ref: "#/components/schemas/QueueSlot" }
    UpdateQueueRequest:
      type: object
      additionalProperties: false
      required: [brand_profile_id]
      properties:
        brand_profile_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        slots:
          type: array
          minItems: 1
          maxItems: 168
          uniqueItems: true
          items: { $ref: "#/components/schemas/QueueSlot" }
    PostTargetInput:
      type: object
      additionalProperties: false
      required: [platform_account_id]
      description: |
        Per-Channel settings to persist for one Platform account.
        attachment_ids: null or omitted inherits the Post's ordered
        attachments, [] publishes text only, and a list overrides membership
        and order for this target. Each account appears at most once.
      properties:
        platform_account_id:
          type: string
          format: uuid
        title_override:
          type: [string, "null"]
          maxLength: 200
        description_override:
          type: [string, "null"]
          maxLength: 5000
        hashtags:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            pattern: "^[^#\\s]+$"
        provider_options:
          oneOf:
            - $ref: "#/components/schemas/ProviderPublishOptions"
            - type: "null"
        attachment_ids:
          type: [array, "null"]
          uniqueItems: true
          items:
            type: string
            format: uuid
    CreatePostRequest:
      type: object
      additionalProperties: false
      required: [brand_profile_id]
      description: |
        Creates one nonempty authoritative draft Post. attachment_ids is the
        ordered attachment set; the array order becomes the attachment
        positions and each Asset may appear once. References may name Assets
        still uploading or processing inside a live upload session of the
        same Brand Profile; readiness is required only at schedulePost.
      anyOf:
        - required: [default_text]
          properties:
            default_text:
              type: string
              minLength: 1
        - required: [attachment_ids]
          properties:
            attachment_ids:
              type: array
              minItems: 1
      properties:
        brand_profile_id:
          type: string
          format: uuid
          description: Active Brand Profile that will own the Post.
        title:
          type: string
          maxLength: 200
        default_text:
          type: string
          maxLength: 10000
        attachment_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        targets:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/PostTargetInput"
    UpdatePostRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [brand_profile_id]
      description: |
        Patch-style save of the same Post. Omitted fields stay unchanged;
        attachment_ids replaces the whole ordered set and targets replaces
        the saved target set. The request must name the Post's owning Brand
        Profile (mismatch is a 422 validation error) and cannot leave the
        Post without text or attachments; claims to Assets already claimed
        for deletion are rejected.
      properties:
        brand_profile_id:
          type: string
          format: uuid
          description: |
            The Post's owning Brand Profile; required as mutation scope
            proof and must equal the stored value.
        title:
          type: string
          maxLength: 200
        default_text:
          type: string
          maxLength: 10000
        attachment_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        targets:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/PostTargetInput"
    DeletePostRequest:
      type: object
      additionalProperties: false
      required: [brand_profile_id]
      properties:
        brand_profile_id:
          type: string
          format: uuid
          description: Selected Brand Profile; must own the addressed Post.
    SchedulePostRequest:
      type: object
      additionalProperties: false
      required: [brand_profile_id]
      oneOf:
        - required: [scheduled_at]
        - required: [queue_id]
      description: |
        Schedules or immediately publishes the Post to its target Channels.
        scheduled_at null means publish now; a timestamp schedules every
        affected target. Alternatively queue_id reserves the next free
        strictly future weekly slot and applies its instant to every pending
        target. Existing Queue membership retains its instant on repeat
        enqueue; remove it before manual scheduling or Publish Now. DST gaps
        skip nonexistent slots; overlaps use the later standard-time instant.
        When targets is present it replaces the saved target set and defines
        the pending-Distribution diff; when absent
        the saved Post targets are used. At least one effective target is
        required, and every affected target must pass Platform capability
        and attachment-readiness validation before any Distribution is
        accepted.
      properties:
        brand_profile_id:
          type: string
          format: uuid
          description: |
            The Post's owning Brand Profile; required as mutation scope
            proof and must equal the stored value.
        scheduled_at:
          type: [string, "null"]
          format: date-time
        queue_id:
          type: string
          format: uuid
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/PostTargetInput"
    SignedUrlResponse:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    Distribution:
      type: object
      additionalProperties: false
      required:
        - id
        - org_id
        - brand_profile_id
        - post_id
        - platform_account_id
        - platform
        - status
        - scheduled_at
        - published_at
        - platform_post_id
        - platform_url
        - title_override
        - description_override
        - hashtags
        - attempt_count
        - last_attempt_at
        - next_attempt_at
        - failure
        - publication
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        brand_profile_id:
          type: string
          format: uuid
          description: |
            Brand Profile that owns this Distribution; identical to the owning
            Brand Profile of its Post and Platform account.
        org_id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
          description: |
            Post this Distribution publishes to its Platform account. One
            Post/account pair carries one live or historical Distribution
            row; attempts and retries reuse it.
        platform_account_id:
          type: [string, "null"]
          format: uuid
        platform:
          $ref: "#/components/schemas/Platform"
        status:
          $ref: "#/components/schemas/DistributionStatus"
        scheduled_at:
          type: [string, "null"]
          format: date-time
        published_at:
          type: [string, "null"]
          format: date-time
        platform_post_id:
          type: [string, "null"]
        platform_url:
          type: [string, "null"]
          format: uri
        publication:
          oneOf:
            - $ref: "#/components/schemas/DistributionPublication"
            - type: "null"
          description: |
            Frozen composition of the newest claimed publish attempt, or null
            while no Provider attempt has claimed this Distribution. Once an
            attempt claims work this is the immutable content it published —
            resolved caption, settings, and ordered media identities — so later
            Post or target edits never rewrite what a Channel shows as its
            published content. Channels without a claim read their pending
            content from the Post and target instead.
        title_override:
          type: [string, "null"]
          maxLength: 200
        description_override:
          type: [string, "null"]
          maxLength: 5000
        hashtags:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[^#\\s]+$"
        attempt_count:
          type: integer
          minimum: 0
        last_attempt_at:
          type: [string, "null"]
          format: date-time
        next_attempt_at:
          type: [string, "null"]
          format: date-time
        failure:
          oneOf:
            - $ref: "#/components/schemas/FailureSummary"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DistributionPublicationMedia:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - position
        - asset_type
        - content_type
        - file_size
        - width
        - height
        - duration_sec
      properties:
        asset_id:
          type: string
          format: uuid
          description: |
            Asset the attempt attached in this position; the identity stays
            stable after the Post detaches it, so published media remains
            addressable through the scoped Asset endpoints while it exists.
        position:
          type: integer
          minimum: 0
          description: Attachment position the publication delivered.
        asset_type:
          $ref: "#/components/schemas/AssetType"
        content_type:
          type: [string, "null"]
          description: |
            MIME type of the rendition handed to the Provider, or the
            attachment's declared type when no object could be frozen.
        file_size:
          type: [integer, "null"]
          minimum: 0
        width:
          type: [integer, "null"]
          minimum: 0
        height:
          type: [integer, "null"]
          minimum: 0
        duration_sec:
          type: [number, "null"]
          minimum: 0
    DistributionPublication:
      type: object
      additionalProperties: false
      required:
        - title
        - text
        - hashtags
        - provider_options
        - media
      description: |
        Immutable resolved composition one Provider publish attempt froze at
        claim time. title and text are the caption the Channel was asked to
        publish after applying its overrides; media is the exact ordered set
        of media identities delivered, each carrying only descriptive facts —
        never storage keys or signed capabilities. An attachment whose
        rendition was not ready at claim keeps its position with null media
        facts instead of silently dropping out of the published order.
      properties:
        title:
          type: string
          description: Frozen caption title; empty when the attempt had none.
        text:
          type: string
          description: Frozen caption body; empty for media-only publications.
        hashtags:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[^#\\s]+$"
        provider_options:
          oneOf:
            - $ref: "#/components/schemas/ProviderPublishOptions"
            - type: "null"
          description: Frozen per-Provider settings the attempt was claimed with.
        media:
          type: array
          description: Frozen media identities in delivered order.
          items:
            $ref: "#/components/schemas/DistributionPublicationMedia"
    DistributionListResponse:
