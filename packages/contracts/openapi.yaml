                $ref: "#/components/schemas/AnalyticsSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /analytics/posts:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Analytics]
      operationId: getAnalyticsPosts
      summary: List Posts ranked by stored analytics in a published cohort
      description: |
        Ranks Posts by their selected stored metric for Distributions published
        inside the requested range. Each Distribution contributes its latest
        analytics snapshot at or before the range end; a Distribution without a
        snapshot still counts as a destination and contributes zero. Ordering is
        the selected metric descending, then publication time descending, then
        Post id ascending. Soft-deleted Posts and Brand Profiles are excluded.
      parameters:
        - $ref: "#/components/parameters/RequiredStart"
        - $ref: "#/components/parameters/RequiredEnd"
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/Platform"
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
        - name: format
          in: query
