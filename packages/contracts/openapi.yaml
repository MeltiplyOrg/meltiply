        zero-based creator ordering; the embedded asset carries the current
        upload/processing state so drafts may persist while media is still
        preparing. An Asset may appear in several retained Posts of the same
        Brand Profile without becoming a shared library entry.
      properties:
        asset_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        asset:
          $ref: "#/components/schemas/Asset"
    PostTarget:
      type: object
      additionalProperties: false
      required:
        [
          platform_account_id,
          title_override,
          description_override,
          hashtags,
          provider_options,
          attachment_ids,
        ]
      description: |
        Saved per-Channel settings for one Platform account on this Post.
        attachment_ids selects and orders this Channel's attachment subset:
        null inherits the Post's ordered attachments, [] publishes text only,
        and a list overrides both membership and order. Targets may exist
        before any Distribution; readiness is enforced only when the target
        is scheduled.
      properties:
        platform_account_id:
          type: string
          format: uuid
        title_override:
          type: [string, "null"]
          maxLength: 200
        description_override:
          type: [string, "null"]
          maxLength: 5000
        hashtags:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            pattern: "^[^#\\s]+$"
        provider_options:
          oneOf:
            - $ref: "#/components/schemas/ProviderPublishOptions"
            - type: "null"
        attachment_ids:
          type: [array, "null"]
          uniqueItems: true
          items:
            type: string
            format: uuid
    Post:
      type: object
      additionalProperties: false
      required:
        [
          id,
          org_id,
          brand_profile_id,
          title,
          default_text,
          status,
          revision,
          attachments,
          targets,
          distributions,
          analytics,
          distribution_analytics,
          queue_membership,
          created_at,
          updated_at,
        ]
      description: |
        Durable composition and publication intent. One Post owns its
        default content, ordered attachments, and saved per-Channel target
        settings; distributions carries each Channel's independent outcome.
        status is a lifecycle marker (draft until first scheduling intent,
        active once distribution starts) and never a global success flag —
        delivery state lives per Distribution. Deletion is a soft delete;
        deleted Posts are not returned.
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        brand_profile_id:
          type: string
          format: uuid
          description: |
            Brand Profile that owns this Post; identical to the owning Brand
            Profile of every attachment Asset, target account, and
            Distribution of this Post.
        title:
          type: string
          maxLength: 200
          description: Optional label; defaults to an empty string.
        default_text:
          type: string
          maxLength: 10000
          description: |
            Post-level caption/body. Empty string with attachments is a
            media-only Post; a Post with neither text nor attachments is not
            persistable.
        status:
          $ref: "#/components/schemas/PostStatus"
        revision:
          type: integer
          minimum: 0
          description: |
            Monotone save counter recorded into each Provider attempt
            snapshot so later edits cannot mutate claimed or published work.
        attachments:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PostAttachment"
        targets:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/PostTarget"
        distributions:
          type: array
          items:
            $ref: "#/components/schemas/Distribution"
        queue_membership:
          oneOf:
            - $ref: "#/components/schemas/QueueMembership"
            - type: "null"
        analytics:
          oneOf:
            - $ref: "#/components/schemas/PostAnalytics"
            - type: "null"
          description: |
            Sum of each published Distribution's latest analytics snapshot,
            read in the same scoped Post batch. Null when no published Channel
            has measurements. Missing measurements do not become zero; an
            explicitly measured zero remains zero. Unsupported metrics are null.
        distribution_analytics:
          type: array
          description: |
            Latest measured snapshot for each published Distribution, ordered
            by Platform then Distribution id. Empty when no published Channel
            has a stored snapshot. A Distribution with no snapshot is omitted,
            so the inspector can distinguish awaiting sync from a measured
            zero; this is the per-Channel source of `analytics`.
          items:
            $ref: "#/components/schemas/PostDistributionAnalytics"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PostDistributionAnalytics:
      type: object
      additionalProperties: false
      required: [distribution_id, platform, analytics]
      properties:
        distribution_id:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/Platform"
        analytics:
          $ref: "#/components/schemas/PostAnalytics"
    PostAnalytics:
      type: object
      additionalProperties: false
      required: [likes, comments, shares, saves, clicks, views, impressions, reach]
      description: |
        Latest measured counters summed across a Post's published Channels.
        Channels without snapshots do not contribute; these are not
        deduplicated cross-platform audience counts. Saves and clicks are
        currently untracked and returned as null.
      properties:
        likes:
          type: [integer, "null"]
          minimum: 0
        comments:
          type: [integer, "null"]
          minimum: 0
        shares:
          type: [integer, "null"]
          minimum: 0
        saves:
          type: [integer, "null"]
          minimum: 0
        clicks:
          type: [integer, "null"]
          minimum: 0
        views:
          type: [integer, "null"]
          minimum: 0
        impressions:
          type: [integer, "null"]
          minimum: 0
        reach:
          type: [integer, "null"]
          minimum: 0
    PostListResponse:
      type: object
      additionalProperties: false
      required: [posts, has_more, limit, offset]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        has_more:
          type: boolean
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    QueueSlot:
      type: object
      additionalProperties: false
      required: [weekday, time]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Sunday is 0.
        time:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
    QueueMembership:
      type: object
      additionalProperties: false
      required: [queue_id, queue_name, assigned_at]
      properties:
        queue_id: { type: string, format: uuid }
        queue_name: { type: string }
        assigned_at: { type: string, format: date-time }
    PublishingQueue:
      type: object
      additionalProperties: false
      required: [id, brand_profile_id, name, timezone, slots, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        brand_profile_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        slots:
          type: array
          minItems: 1
          maxItems: 168
          uniqueItems: true
          items: { $ref: "#/components/schemas/QueueSlot" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QueueListResponse:
      type: object
