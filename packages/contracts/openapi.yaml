    AnalyticsMetric:
      type: string
      enum: [views, likes, comments, shares]
      description: Stored metric that ranks the Post analytics rows.
    AnalyticsSummary:
      type: object
      additionalProperties: false
      required: [range, totals, by_platform, last_synced_at, partial, unsupported_platforms]
      properties:
        range:
          $ref: "#/components/schemas/AnalyticsRange"
        totals:
          $ref: "#/components/schemas/MetricTotals"
        by_platform:
          type: array
          items:
            $ref: "#/components/schemas/PlatformMetrics"
        last_synced_at:
          type: [string, "null"]
          format: date-time
        partial:
          type: boolean
        unsupported_platforms:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Platform"
    AnalyticsPostRow:
      type: object
      additionalProperties: false
      required:
        [
          post_id,
          title,
          excerpt,
          published_at,
          destination_count,
          synced_destination_count,
          platforms,
          unsupported_platforms,
          last_synced_at,
          views,
          likes,
          comments,
          shares,
        ]
      properties:
        post_id:
          type: string
          format: uuid
        title:
          type: string
          description: Post title; may be empty when the composition has no title.
        excerpt:
          type: string
          description: |
            First 140 characters of the Post's default text with whitespace
            collapsed; may be empty.
        published_at:
          type: string
          format: date-time
          description: Earliest publication time among the included Distributions.
        destination_count:
          type: integer
          minimum: 0
          description: Number of published Distributions included for this Post.
        synced_destination_count:
          type: integer
          minimum: 0
          description: |
            Included Distributions with at least one snapshot at or before the
            range end. Fewer than `destination_count` means some destinations
            contribute zero until their first sync.
        platforms:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Platform"
        unsupported_platforms:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Platform"
        last_synced_at:
          type: [string, "null"]
          format: date-time
          description: |
            Latest snapshot time among the Post's included Distributions, or
            null when none has been stored yet.
        views:
          type: integer
          minimum: 0
        likes:
          type: integer
          minimum: 0
        comments:
          type: integer
          minimum: 0
        shares:
          type: integer
          minimum: 0
    AnalyticsPostsResponse:
      type: object
      additionalProperties: false
      required: [posts, has_more, limit, offset]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsPostRow"
        has_more:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    AnalyticsSnapshot:
      type: object
      additionalProperties: false
