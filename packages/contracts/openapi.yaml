        views:
          type: integer
          minimum: 0
        likes:
          type: integer
          minimum: 0
        comments:
          type: integer
          minimum: 0
        shares:
          type: integer
          minimum: 0
        watch_time_sec:
          type: integer
          minimum: 0
        reach:
          type: integer
          minimum: 0
        impressions:
          type: integer
          minimum: 0
        snapshot_at:
          type: string
          format: date-time
    AnalyticsSnapshotsResponse:
      type: object
      additionalProperties: false
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsSnapshot"
    InboxComment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          distribution_id,
          post_id,
          brand_profile_id,
          platform,
          platform_comment_id,
          author_name,
          author_avatar,
          body,
          reply_text,
          reply_status,
          failure,
          commented_at,
          synced_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        distribution_id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
          description: |
            Post that owns the Comment's Distribution; identical to
            distributions.post_id for that outcome.
        brand_profile_id:
          type: string
          format: uuid
          description: |
            Brand Profile that owns the Comment through its Distribution;
            replies must be sent under this profile.
        platform:
          $ref: "#/components/schemas/Platform"
        platform_comment_id:
          type: string
        author_name:
          type: [string, "null"]
        author_avatar:
          type: [string, "null"]
          format: uri
        body:
          type: string
        reply_text:
          type: [string, "null"]
        reply_status:
          $ref: "#/components/schemas/ReplyStatus"
        failure:
          oneOf:
            - $ref: "#/components/schemas/FailureSummary"
            - type: "null"
        commented_at:
          type: string
          format: date-time
        synced_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InboxResponse:
      type: object
      additionalProperties: false
      required: [comments, has_more, limit, offset]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/InboxComment"
        has_more:
          type: boolean
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    ReplyToCommentRequest:
      type: object
      additionalProperties: false
      required: [brand_profile_id, text]
      properties:
        brand_profile_id:
          type: string
          format: uuid
          description: |
            Active Brand Profile the reply is sent under; must equal the Brand
            Profile that owns the Comment's Distribution.
        text:
          type: string
          minLength: 1
          maxLength: 5000
