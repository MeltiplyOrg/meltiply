            $ref: "#/components/schemas/AnalyticsFormat"
        - $ref: "#/components/parameters/BrandProfileId"
        - name: metric
          in: query
          schema:
            $ref: "#/components/schemas/AnalyticsMetric"
            default: views
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Ranked Posts and pagination metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsPostsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /analytics/dashboard:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Analytics]
      operationId: getAnalyticsDashboard
      summary: Read the analytics dashboard series and breakdowns
      description: |
        Returns stored-snapshot aggregates for the published cohort. Daily
        series carry measured counter changes between consecutive snapshots,
        not lifetime totals. Follower series come from account snapshots.
        Metrics a Provider does not expose are returned as null or listed in
        `unavailable_metrics`; they are never fabricated as zero. `cohort`
        carries the same published-cohort summary as `GET /analytics`, so a
        client can render KPIs, coverage, and the platform comparison from one
        request.
      parameters:
        - $ref: "#/components/parameters/RequiredStart"
        - $ref: "#/components/parameters/RequiredEnd"
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/Platform"
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            $ref: "#/components/schemas/AnalyticsFormat"
        - $ref: "#/components/parameters/BrandProfileId"
      responses:
        "200":
          description: Dashboard series and breakdowns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDashboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /analytics/{distribution_id}:
    parameters:
      - $ref: "#/components/parameters/DistributionId"
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Analytics]
      operationId: getDistributionAnalytics
      summary: Get one distribution's analytics snapshots
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Ordered analytics snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSnapshotsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /inbox:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Inbox]
      operationId: listInboxComments
      summary: List synchronized comments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: unreplied
          in: query
          schema:
            type: boolean
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/Platform"
        - name: distribution_id
          in: query
          schema:
            type: string
            format: uuid
        - name: reply_status
          in: query
          schema:
            $ref: "#/components/schemas/ReplyStatus"
        - $ref: "#/components/parameters/BrandProfileId"
      responses:
        "200":
          description: Paginated comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inbox/{comment_id}/reply:
    parameters:
      - $ref: "#/components/parameters/CommentId"
      - $ref: "#/components/parameters/XWorkspaceId"
    post:
      tags: [Inbox]
      operationId: replyToComment
      summary: Durably queue a provider comment reply
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyToCommentRequest"
      responses:
        "202":
          description: Reply durably queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived Better Auth JWT sent as `Authorization: Bearer <jwt>` on
        /api/v1 requests. The JWT plugin mints it and delivers it through the
        `set-auth-jwt` response header on GET /api/auth/get-session; the
        frontend holds it in memory only and renews it through the session
        lifecycle. The HttpOnly session cookie is not an /api/v1 credential:
        it authenticates /api/auth minting and lifecycle calls only.
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        HttpOnly Better Auth session cookie on the same origin, required by
        /api/auth operations that act on the active session (sign-out,
        change-password). Over HTTPS the cookie carries the `__Secure-`
        prefix (`__Secure-better-auth.session_token`); both names refer to
        the same credential. It is internal to the /api/auth lifecycle and
        never authorizes /api/v1 endpoints.
  headers:
    RequestId:
      description: Correlation identifier for this request.
      schema:
        type: string
    RetryAfter:
      description: Seconds before the caller should retry.
      schema:
        type: integer
        minimum: 0
    IdempotencyReplayed:
      description: True when the original stored response was replayed.
      schema:
        type: string
        enum: ["true"]
    SessionCookie:
      description: |
        Establishes, rotates, or expires the Better Auth session cookie
        (`better-auth.session_token`, or `__Secure-better-auth.session_token`
        over HTTPS). HttpOnly; SameSite=Lax; Path=/. Internal to the /api/auth
        session lifecycle; it is not an /api/v1 credential.
      schema:
        type: string
    AuthJwt:
      description: |
        Short-lived bearer JWT minted by the Better Auth JWT plugin. Sent only
        on GET /api/auth/get-session responses that resolve an active session;
        the client holds it in memory and forwards it as
        `Authorization: Bearer <jwt>` on /api/v1 requests.
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[\x20-\x7E]+$'
    XWorkspaceId:
      name: X-Workspace-ID
      in: header
      required: false
      description: |
        Optional shared-Workspace selection for the authenticated caller. The
        server validates the caller's org_members membership before it becomes
        the actor and RLS claim. An installation has exactly one shared
        Workspace, so a mismatched UUID fails with 403 `workspace_forbidden`.
        When absent, the shared Workspace is selected automatically.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    AuditSearch:
      name: q
      in: query
      required: false
      description: |
        Case-insensitive substring matched against the action, the actor's email
        or display name, and the target id.
      schema:
        type: string
        maxLength: 100
    AuditAction:
      name: action
      in: query
      required: false
      description: Exact action identifier, for example `member.role_changed`.
      schema:
        type: string
        maxLength: 100
    AuditTargetType:
      name: target_type
      in: query
      required: false
      description: Exact target type, for example `member` or `invitation`.
      schema:
        type: string
        maxLength: 64
    Start:
      name: start
      in: query
      required: false
      schema:
        type: string
        format: date-time
    End:
      name: end
      in: query
      required: false
      schema:
        type: string
        format: date-time
    RequiredStart:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date-time
    RequiredEnd:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Platform:
      name: platform
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Platform"
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SelectionId:
      name: selection_id
      in: path
      required: true
      description: Opaque OAuth selection session identifier.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: post_id
      in: path
      required: true
      description: Durable Post identifier within the active workspace.
      schema:
        type: string
        format: uuid
    DistributionId:
      name: distribution_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: comment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      description: |
        Workspace UUID addressed by this lifecycle operation. The server
        resolves the caller's membership and role for this workspace; the
        X-Workspace-ID header is not used on workspace lifecycle routes.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: Single-use invitation token from the invitation email link.
      schema:
        type: string
        minLength: 16
        maxLength: 255
    MemberId:
      name: memberId
      in: path
      required: true
      description: UUID of the member's user within the addressed workspace.
      schema:
        type: string
        format: uuid
    BrandProfileId:
      name: brand_profile_id
      in: query
      required: false
      description: |
        Restricts the result to one Brand Profile. When omitted, the operation
        returns the workspace-wide aggregate across all active Brand Profiles
        (the read-only All Brand Profiles view).
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profile_id
      in: path
      required: true
      description: Brand Profile UUID within the active workspace.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AuthError:
      description: |
        Better Auth rejected the request; the envelope carries a machine
        `code` and human-readable `message` rather than the v1 ErrorEnvelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    Unauthorized:
      description: Bearer JWT is missing, expired, or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Active identity lacks workspace membership, role, entitlement, or quota.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource is absent or not visible to the active organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Request conflicts with resource or idempotency state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: API or asset payload exceeds a bound.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: API or asset media type is unsupported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: Request is syntactically valid but semantically invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Request is temporarily rate limited.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AuthRateLimited:
      description: Authentication attempt budget or temporary factor lockout is exhausted.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/AuthError"
    UpstreamError:
      description: Required synchronous upstream failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required dependency or service is temporarily unavailable.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Platform:
      type: string
      enum: [tiktok, youtube, instagram, facebook, threads]
    AssetType:
      type: string
      enum: [image, video]
    PostStatus:
      type: string
      enum: [draft, active]
    AssetStatus:
      type: string
      enum: [pending_upload, uploading, processing, ready, failed, deleting, deleted]
    DistributionStatus:
      type: string
      enum:
        - scheduled
        - queued
        - processing
        - awaiting_provider
        - published
        - failed
        - cancel_requested
        - cancelled
        - needs_reconciliation
    ReplyStatus:
      type: string
      enum: [not_replied, queued, processing, replied, failed, needs_reconciliation]
    ConnectionStatus:
      type: string
      enum: [connected, expiring, expired, revoked, reconnect_required]
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        field:
          type: [string, "null"]
        code:
          type: string
        constraint:
          type: string
        limit:
          type: number
        actual:
          type: number
        message:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable, details]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [field, constraint, message]
      properties:
        field:
          type: string
        constraint:
          type: string
        message:
          type: string
        limit:
          type: number
        actual:
          type: number
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Health:
      type: object
      additionalProperties: false
      required: [status, version, environment]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
        environment:
          type: string
    ReadinessComponent:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ready, degraded, unavailable]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, components]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        components:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessComponent"
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, emailVerified, name, image, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Better Auth user subject; maps one-to-one to users.auth_user_id.
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        name:
          type: [string, "null"]
        image:
          type: [string, "null"]
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        twoFactorEnabled:
          type: boolean
    AuthSession:
      type: object
      additionalProperties: false
      required: [id, userId, expiresAt]
      properties:
        id:
          type: string
        userId:
          type: string
          description: Better Auth user subject owning this session.
        token:
          type: string
          description: Internal Better Auth session token transported by the HttpOnly cookie; it is not the /api/v1 bearer JWT.
        expiresAt:
          type: string
          format: date-time
        ipAddress:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthSessionResult:
      type: object
      additionalProperties: false
      required: [session, user]
      properties:
        session:
          $ref: "#/components/schemas/AuthSession"
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthTokenResult:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        redirect:
          type: boolean
          description: True when the request asked for a callbackURL redirect.
        token:
          type: [string, "null"]
          description: |
            Internal Better Auth session token — not the /api/v1 bearer JWT;
            null when sign-up did not auto sign in or when a password change
            did not mint a replacement session.
        url:
          type: [string, "null"]
          format: uri
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthStatusResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: boolean
        message:
          type: string
    AuthSuccessResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
    VerifyEmailResult:
      type: object
      additionalProperties: false
      required: [status, user]
      properties:
        status:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AuthError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        code:
          type: string
          description: Better Auth error code such as INVALID_EMAIL_OR_PASSWORD.
        message:
          type: string
    SignInEmailRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
        callbackURL:
          type: string
          format: uri
        rememberMe:
          type: boolean
          default: true
    SignUpEmailRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        callbackURL:
          type: string
          format: uri
    RequestPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
        redirectTo:
          type: string
          format: uri
          description: Frontend URL the reset link redirects to with the token.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [newPassword, token]
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
        token:
          type: string
          minLength: 1
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
        revokeOtherSessions:
          type: boolean
          default: false
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, name, slug, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          type: string
    UserProfile:
      type: object
      additionalProperties: false
      required:
        [
          id,
          email,
          display_name,
          avatar_url,
          active_organization,
          is_installation_owner,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          format: uri
        active_organization:
          $ref: "#/components/schemas/OrganizationSummary"
        is_installation_owner:
          type: boolean
          description: |
            True for the installation's single Owner. Ownership is
            installation-level authority and is separate from the Workspace
            role; content access still follows the Workspace membership.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceRole:
      type: string
      enum: [admin, editor, viewer]
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
          description: Caller's membership role in this workspace.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceMember:
      type: object
      additionalProperties: false
      required:
        [
          user_id,
          email,
          display_name,
          avatar_url,
          role,
          status,
          suspended_at,
          is_installation_owner,
          created_at,
          updated_at,
        ]
      properties:
        user_id:
          type: string
          format: uuid
          description: Internal user UUID; the memberId path parameter.
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          format: uri
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status:
          type: string
          enum: [active, suspended]
        suspended_at:
          type: [string, "null"]
          format: date-time
        is_installation_owner:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: Membership join date.
        updated_at:
          type: string
          format: date-time
    WorkspaceMemberListResponse:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMember"
    WorkspaceInvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    WorkspaceInvitation:
      type: object
      additionalProperties: false
      required: [id, org_id, email, role, status, expires_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status:
          $ref: "#/components/schemas/WorkspaceInvitationStatus"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
