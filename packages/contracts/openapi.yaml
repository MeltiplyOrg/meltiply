openapi: 3.1.0
info:
  title: Meltiply API
  version: 1.0.0-target.0
  summary: Contract for the Meltiply frontend and Worker API.
  license:
    name: All rights reserved
    identifier: LicenseRef-Proprietary
  description: |
    This is the target v1 contract for the Cloudflare Workers migration.
    It is executable planning input, not evidence that every operation is
    implemented in the current Worker API.
servers:
  - url: http://localhost:8787/api/v1
    description: Local Worker API
  - url: https://api.staging.meltiply.com/api/v1
    description: Staging Worker API
security:
  - bearerAuth: []
tags:
  - name: Operations
    description: Liveness and dependency readiness.
  - name: Auth
    description: |
      Better Auth browser session lifecycle served under /api/auth. The
      HttpOnly session cookie authenticates these lifecycle calls only; the
      bearer JWT that authorizes /api/v1 requests is minted and renewed
      through the `set-auth-jwt` response header on GET /api/auth/get-session.
  - name: Users
    description: Authenticated user and active workspace.
  - name: Workspaces
    description: |
      The single shared Workspace, member and invitation administration, and
      the readable audit trail. Management actions require the Workspace Admin
      role; only the Installation Owner may assign Admins or transfer
      ownership. Content access follows the Workspace role.
  - name: Installation
    description: |
      Installation-level settings: Seat usage, account suspension,
      reactivation, hard deletion, and ownership transfer. Mutating operations
      require the Installation Owner.
  - name: Brand Profiles
    description: |
      Named, color-labelled ownership scopes inside a workspace. Every Asset,
      Platform account (Channel), and Distribution belongs to exactly one
      Brand Profile; management mutations require the workspace admin role.
  - name: Platforms
    description: Provider capabilities, accounts, and OAuth.
  - name: Assets
    description: |
      Internal post-owned media uploads. Assets are created only through
      direct R2 upload sessions inside the composer; they are not a
      browsable library and carry no Post content.
  - name: Posts
    description: |
      Durable Post compositions with ordered media attachments, saved
      per-Channel target settings, and per-target Distribution outcomes.
      Drafts are Posts, not a separate asset type; scheduling or immediate
      publication keeps the same Post identity.
  - name: Queues
    description: Brand Profile-owned recurring publishing plans, distinct from transport queues.
  - name: Distributions
    description: |
      Per-Channel publication outcomes for a Post. Distributions are created
      and edited only through Post scheduling; existing outcomes stay
      independently readable, editable while pending, cancellable, and
      retryable.
  - name: Calendar
    description: Distribution timeline events.
  - name: Analytics
    description: Aggregate and per-distribution metrics.
  - name: Inbox
    description: Synchronized comments and replies.
paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Process is live.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 01JZRELEASE
                environment: staging
  /ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      security: []
      summary: Bounded dependency readiness check
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more required dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/auth/setup-status:
    servers: &authServers
      - url: http://localhost:8787
      - url: https://staging.meltiply.com
    get:
      tags: [Auth]
      operationId: getSetupStatus
      security: []
      summary: Read whether this installation has an owner
      description: Returns only the initialized bit with Cache-Control no-store. Missing bootstrap configuration fails closed.
      responses:
        "200":
          description: Installation status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [initialized]
                properties:
                  initialized:
                    type: boolean
        "503":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/send-verification-email:
    servers: *authServers
    post:
      tags: [Auth]
      operationId: resendVerification
      security: []
      summary: Resend an owner verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                callbackURL:
                  type: string
                  format: uri
      responses:
        "200":
          description: Verification request accepted without disclosing account existence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/two-factor/enable:
    servers: *authServers
    post:
      tags: [Auth]
      operationId: enableTwoFactor
      security:
        - sessionCookie: []
      summary: Begin password-reauthenticated authenticator enrollment
      description: Returns a secret URI and backup codes once. TOTP remains disabled until verify-totp succeeds.
      requestBody: &factorPasswordBody
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Pending authenticator and encrypted-at-rest backup codes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [method, totpURI, backupCodes]
                properties:
                  method:
                    type: string
                    enum: [totp]
                  totpURI:
                    type: string
                  backupCodes:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/two-factor/disable:
    servers: *authServers
    post:
      tags: [Auth]
      operationId: disableTwoFactor
      security:
        - sessionCookie: []
      summary: Disable or cancel authenticator enrollment after password verification
      requestBody: *factorPasswordBody
      responses:
        "200":
          description: Authenticator disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/two-factor/generate-backup-codes:
    servers: *authServers
    post:
      tags: [Auth]
      operationId: generateBackupCodes
      security:
        - sessionCookie: []
      summary: Replace all backup codes after password verification
      requestBody: *factorPasswordBody
      responses:
        "200":
          description: New one-use backup codes; previous codes are invalid.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, backupCodes]
                properties:
                  status:
                    type: boolean
                  backupCodes:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/two-factor/verify-totp:
    servers: *authServers
    post:
      tags: [Auth]
      operationId: verifyTotp
      security: []
      summary: Confirm enrollment or complete a pending authenticator sign-in
      description: Requires either a session cookie for enrollment or the signed pending-factor cookie from password sign-in.
      requestBody: &factorCodeBody
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                trustDevice:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Factor accepted and session established or enrollment confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/auth/two-factor/verify-backup-code:
    servers: *authServers
    post:
      tags: [Auth]
      operationId: verifyBackupCode
      security: []
      summary: Consume a backup code to complete a pending sign-in
      description: Requires the signed pending-factor cookie. A consumed code cannot be reused.
      requestBody: *factorCodeBody
      responses:
        "200":
          description: Backup code consumed and a session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "409":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/auth/sign-in/email:
    servers:
      - url: http://localhost:8787
        description: Local Worker API
      - url: https://staging.meltiply.com
        description: Staging same-origin frontend
    post:
      tags: [Auth]
      operationId: signInWithEmail
      security: []
      summary: Sign in with email and password
      description: |
        Verifies credentials and, on success, sets the HttpOnly session cookie
        and returns the session token and user. The cookie authenticates
        /api/auth lifecycle calls only; the bearer JWT for /api/v1 is minted
        by the `set-auth-jwt` response header on GET /api/auth/get-session.
        Subject to the database-backed fixed-window authentication rate limit
        keyed by action and normalized email/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInEmailRequest"
      responses:
        "200":
          description: Authenticated session and user.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthTokenResult"
                  - type: object
                    additionalProperties: false
                    required: [twoFactorRedirect]
                    properties:
                      twoFactorRedirect:
                        type: boolean
                        const: true
                      twoFactorMethods:
                        type: array
                        items:
                          type: string
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/sign-up/email:
    servers:
      - url: http://localhost:8787
        description: Local Worker API
      - url: https://staging.meltiply.com
        description: Staging same-origin frontend
    post:
      tags: [Auth]
      operationId: signUpWithEmail
      security: []
      summary: Register with name, email, and password
      description: |
        Creates the Better Auth credential account and, when auto sign-in is
        enabled, sets the HttpOnly session cookie and returns the session
        token and user. The cookie authenticates /api/auth lifecycle calls
        only; the bearer JWT for /api/v1 is minted by the `set-auth-jwt`
        response header on GET /api/auth/get-session. Subject to the
        database-backed fixed-window authentication rate limit keyed by
        action and normalized email/IP.
        This installation accepts exactly one owner; subsequent signup is forbidden.
      parameters:
        - name: X-Setup-Secret
          in: header
          required: true
          schema:
            type: string
            minLength: 32
          description: Deployment-controlled bootstrap secret, used only before an owner exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpEmailRequest"
      responses:
        "200":
          description: Created user and session token.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
        "422":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/sign-out:
    servers:
      - url: http://localhost:8787
        description: Local Worker API
      - url: https://staging.meltiply.com
        description: Staging same-origin frontend
    post:
      tags: [Auth]
      operationId: signOut
      security:
        - sessionCookie: []
      summary: Revoke the active session
      description: |
        Deletes the database session row for the presented session cookie and
        emits an expired Set-Cookie header so the browser clears it. Clients
        discard the in-memory bearer JWT afterwards: it is never reissued
        because get-session can no longer resolve a session.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Session revoked.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/get-session:
    servers:
      - url: http://localhost:8787
        description: Local Worker API
      - url: https://staging.meltiply.com
        description: Staging same-origin frontend
    get:
      tags: [Auth]
      operationId: getAuthSession
      security: []
      summary: Read the current session
      description: |
        Returns the session and user for the presented session cookie, or null
        when the cookie is absent, expired, or revoked. When a session is
        active the response also carries the `set-auth-jwt` header — a fresh
        short-lived bearer JWT the client holds in memory and sends as
        `Authorization: Bearer` on /api/v1 requests. This is the only channel
        that issues or renews the bearer credential.
      responses:
        "200":
          description: Active session and user, or null when unauthenticated.
          headers:
            set-auth-jwt:
              $ref: "#/components/headers/AuthJwt"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthSessionResult"
                  - type: "null"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/request-password-reset:
    servers:
      - url: http://localhost:8787
        description: Local Worker API
      - url: https://staging.meltiply.com
        description: Staging same-origin frontend
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      security: []
      summary: Send a password reset email
      description: |
        Issues a single-use recovery token and delivers the reset link through
        the configured transactional email provider. Subject to the
        database-backed fixed-window authentication rate limit keyed by action
        and normalized email/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "200":
          description: Reset email accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/reset-password:
    servers:
      - url: http://localhost:8787
        description: Local Worker API
      - url: https://staging.meltiply.com
        description: Staging same-origin frontend
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      summary: Reset the password with a recovery token
      description: |
        Consumes the single-use recovery token and sets a new credential
        password. Other sessions for the account are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/verify-email:
    servers:
      - url: http://localhost:8787
        description: Local Worker API
      - url: https://staging.meltiply.com
        description: Staging same-origin frontend
    get:
      tags: [Auth]
      operationId: verifyEmail
      security: []
      summary: Verify an email address from a token link
      description: |
        Verifies the email address bound to the token. When callbackURL is
        supplied the response redirects there; otherwise a JSON status is
        returned.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 16
        - name: callbackURL
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResult"
        "302":
          description: Redirect to callbackURL with the verification outcome.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/change-password:
    servers:
      - url: http://localhost:8787
        description: Local Worker API
      - url: https://staging.meltiply.com
        description: Staging same-origin frontend
    post:
      tags: [Auth]
      operationId: changePassword
      security:
        - sessionCookie: []
      summary: Change the password within an authenticated session
      description: |
        Verifies the current password, sets the new credential password, and
        optionally revokes every other session for the account. When other
        sessions are revoked a replacement session is created and delivered
        through Set-Cookie; the bearer JWT is renewed separately via
        GET /api/auth/get-session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; a fresh session token is returned when other sessions were revoked.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/me:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user and active workspace
      responses:
        "200":
          description: Current user profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceIdPath"
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Rename or re-slug a workspace
      description: |
        Updates workspace display fields. Requires the admin role in the
        addressed shared Workspace.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: Updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceIdPath"
    get:
      tags: [Workspaces]
      operationId: listWorkspaceInvitations
      summary: List pending invitations
      description: |
        Returns pending, unexpired invitations in reverse creation order.
        Requires the Workspace Admin role.
      responses:
        "200":
          description: Pending invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Workspaces]
      operationId: createWorkspaceInvitation
      summary: Invite a member to a team workspace
      description: |
        Creates a pending invitation and delivers the acceptance link through
        the configured transactional email provider. Requires the admin role,
        and at most one pending invitation may exist per workspace and email.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceInvitationRequest"
      responses:
        "201":
          description: Pending invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceIdPath"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceInvitation
      summary: Revoke a pending invitation
      description: |
        Marks a pending invitation revoked so its token can no longer be
        accepted. Requires the admin role in the addressed workspace.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Invitation revoked or prior revocation replayed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: "#/components/parameters/WorkspaceIdPath"
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [Workspaces]
      operationId: resendWorkspaceInvitation
      summary: Resend a pending invitation
      description: |
        Rotates the invitation token, extends the expiry by seven days, and
        delivers a fresh acceptance link. The previous link stops working.
        Requires the Workspace Admin role.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reissued pending invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: Invitation has been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspace-invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      tags: [Workspaces]
      operationId: getWorkspaceInvitation
      summary: Inspect an invitation token
      description: |
        Returns the invited email, role, Workspace name, and lifecycle status
        so the acceptance page can render before the visitor signs in. Token
        possession is the credential; no account is required.
      responses:
        "200":
          description: Invitation preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspace-invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      tags: [Workspaces]
      operationId: acceptWorkspaceInvitation
      summary: Accept a workspace invitation
      description: |
        Consumes a pending invitation token and atomically creates the
        caller's membership in the invited workspace. The invitation token is
        the idempotency credential; replayed acceptance returns the existing
        membership.
      responses:
        "200":
          description: Accepted membership and its workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptWorkspaceInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceIdPath"
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: List workspace members
      description: |
        Returns every member with role, status, and join date. Requires the
        Workspace Admin role.
      responses:
        "200":
          description: Workspace members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceIdPath"
      - $ref: "#/components/parameters/MemberId"
    patch:
      tags: [Workspaces]
      operationId: updateWorkspaceMember
      summary: Change a member's role
      description: |
        Updates a member's role in the addressed workspace. Requires the admin
        role; the last remaining admin cannot be demoted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceMemberRequest"
      responses:
        "200":
          description: Updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a member from a workspace
      description: |
        Removes the membership row, severing the member's access to the
        workspace. Requires the admin role, except that any member may remove
        their own membership; the last remaining admin cannot be removed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Member removed or prior removal replayed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /installation:
    get:
      tags: [Installation]
      operationId: getInstallation
      summary: Read installation settings and Seat usage
      description: |
        Returns the Seat limit, active members, pending invitations, and the
        shared Workspace. Requires the Workspace Admin role or Installation
        Ownership.
      responses:
        "200":
          description: Installation summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /installation/members/{memberId}/suspend:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      tags: [Installation]
      operationId: suspendInstallationMember
      summary: Suspend a member
      description: |
        Immediately revokes every session and releases the member's Seat while
        preserving their membership and content attribution. Installation
        Owner only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendMemberRequest"
      responses:
        "200":
          description: Suspended account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLifecycle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /installation/members/{memberId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      tags: [Installation]
      operationId: reactivateInstallationMember
      summary: Reactivate a suspended member
      description: |
        Restores sign-in when a Seat is free. Installation Owner only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Active account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLifecycle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /installation/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    delete:
      tags: [Installation]
      operationId: deleteInstallationMember
      summary: Permanently delete a member account
      description: |
        Removes the auth account, sessions, and membership while leaving
        Workspace content intact. The confirmation email must match. The
        Installation Owner cannot delete their own account. Owner only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardDeleteMemberRequest"
      responses:
        "204":
          description: Account deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /installation/ownership-transfer:
    post:
      tags: [Installation]
      operationId: transferInstallationOwnership
      summary: Transfer installation ownership
      description: |
        Reauthenticates the current Owner with their password and transfers
        ownership to an active Workspace Admin. The previous Owner remains a
        Workspace Admin. Owner only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnershipTransferRequest"
      responses:
        "200":
          description: New Installation Owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipTransferResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/audit:
    parameters:
      - $ref: "#/components/parameters/WorkspaceIdPath"
    get:
      tags: [Workspaces]
      operationId: listWorkspaceAudit
      summary: Read the workspace audit trail
      description: |
        Returns administrative Audit entries in reverse chronological order.
        Requires the Workspace Admin role or Installation Ownership.
      parameters:
        - $ref: "#/components/parameters/AuditLimit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/AuditSearch"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTargetType"
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /brand-profiles:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Brand Profiles]
      operationId: listBrandProfiles
      summary: List active brand profiles
      description: |
        Returns every active Brand Profile in the active workspace, ordered by
        name. Soft-deleted profiles are excluded; workspace admins list them
        through GET /brand-profiles/deleted.
      responses:
        "200":
          description: Active brand profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfileListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Brand Profiles]
      operationId: createBrandProfile
      summary: Create a brand profile
      description: |
        Creates an active Brand Profile in the active workspace. The name must
        normalize uniquely within the workspace, including names reserved by
        soft-deleted profiles awaiting purge. Requires the workspace admin
        role.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandProfileRequest"
      responses:
        "201":
          description: Created brand profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /brand-profiles/deleted:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Brand Profiles]
      operationId: listDeletedBrandProfiles
      summary: List soft-deleted brand profiles
      description: |
        Returns soft-deleted Brand Profiles still inside their retention
        window, ordered by deletion time. Requires the workspace admin role.
      responses:
        "200":
          description: Soft-deleted brand profiles awaiting purge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfileListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /brand-profiles/{profile_id}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Brand Profiles]
      operationId: getBrandProfile
      summary: Get a brand profile
      description: |
        Returns one Brand Profile. Soft-deleted profiles resolve only for
        workspace admins; other members receive 404.
      responses:
        "200":
          description: Brand profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Brand Profiles]
      operationId: updateBrandProfile
      summary: Rename or recolor a brand profile
      description: |
        Updates an active Brand Profile's name or color label. The name must
        normalize uniquely within the workspace, including names reserved by
        soft-deleted profiles awaiting purge. Requires the workspace admin
        role; soft-deleted profiles must be restored before they can change.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandProfileRequest"
      responses:
        "200":
          description: Updated brand profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Brand Profiles]
      operationId: deleteBrandProfile
      summary: Permanently delete a brand profile
      description: |
        Permanently removes a Brand Profile and its profile-owned data. Its
        Channels are locally disconnected first so provider revocation can run
        from the durable outbox. Requires the workspace admin role.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Permanently deleted brand profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /brand-profiles/{profile_id}/restore:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/XWorkspaceId"
    post:
      tags: [Brand Profiles]
      operationId: restoreBrandProfile
      summary: Restore a soft-deleted brand profile
      description: |
        Restores a soft-deleted Brand Profile inside its retention window.
        Disconnected Channels stay disconnected and cancelled Distributions
        stay cancelled; only the profile and its retained data return.
        Requires the workspace admin role.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Restored active brand profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /platforms/capabilities:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Platforms]
      operationId: listPlatformCapabilities
      summary: List authoritative provider capabilities
      responses:
        "200":
          description: Capability rows for every known platform.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCapabilitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /platforms:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Platforms]
      operationId: listPlatformAccounts
      summary: List connected accounts for the active organization
      parameters:
        - $ref: "#/components/parameters/BrandProfileId"
      responses:
        "200":
          description: Connected platform accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccountsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /platforms/{platform}/connect:
    parameters:
      - $ref: "#/components/parameters/Platform"
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Platforms]
      operationId: startPlatformOAuth
      summary: Start provider OAuth
      description: |
        Begins the provider authorization handoff. No Brand Profile is selected
        yet: the callback discovers the authorized account(s), stages a
        short-lived pending assignment session, and returns the browser to the
        Channel assignment view. The chosen Brand Profile is supplied when the
        assignment is confirmed, immediately before the Channel is persisted.
      responses:
        "200":
          description: Provider authorization URL for authenticated browser clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartResponse"
        "307":
          description: Redirect to the provider authorization URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /platforms/{platform}/callback:
    parameters:
      - $ref: "#/components/parameters/Platform"
    get:
      tags: [Platforms]
      operationId: completePlatformOAuth
      security: []
      summary: Complete provider OAuth with consume-once state
      description: |
        Completes the provider OAuth exchange using consume-once state. The
        authorized account or accounts are staged in a short-lived pending
        assignment session; no Channel is persisted until the user selects an
        account (when the provider returns more than one) and the Brand Profile
        that should own it. Redirects (302) to the Channel assignment view
        (/channels/connect?selection_id={selection_id}) with the provider
        outcome query appended.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 16
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: |
            Redirect to the Channel assignment view
            (/channels/connect?oauth=select_account&provider={platform}&selection_id={selection_id})
            with the provider outcome appended. No Channel is persisted before the
            user confirms the account and its owning Brand Profile.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /oauth-selections/{selection_id}:
    parameters:
      - $ref: "#/components/parameters/SelectionId"
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Platforms]
      operationId: getOAuthSelection
      summary: Get pending OAuth account assignment session
      description: |
        Retrieves the public candidate accounts discovered during OAuth authorization
        for explicit account and Brand Profile selection. Only metadata is returned;
        external credentials remain encrypted server-side in durable state.
      responses:
        "200":
          description: Pending OAuth account selection session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthSelection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Platforms]
      operationId: cancelOAuthSelection
      summary: Cancel pending OAuth account selection session
      description: |
        Discards a pending OAuth account selection session and its retained
        credentials. Cancellation is idempotent and guarantees no platform
        account is connected.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: OAuth account selection session cancelled and discarded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /oauth-selections/{selection_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/SelectionId"
      - $ref: "#/components/parameters/XWorkspaceId"
    post:
      tags: [Platforms]
      operationId: confirmOAuthSelection
      summary: Confirm and connect chosen platform account
      description: |
        Completes the pending OAuth assignment session by persisting exactly one
        chosen candidate account under the requested Brand Profile. The profile
        must be active in the workspace and must not already own a Channel of
        the same Platform.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthSelectionConfirmRequest"
      responses:
        "204":
          description: Chosen account connected to the Brand Profile.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /platforms/{account_id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/XWorkspaceId"
    delete:
      tags: [Platforms]
      operationId: disconnectPlatformAccount
      summary: Disconnect a platform account
      description: |
        Removes the Channel from its Brand Profile and cancels its scheduled
        Distributions immediately. Remote provider revocation is attempted and
        retried durably in the background; a failed revocation never restores
        local use.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Account disconnected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /platforms/{account_id}/publishing-requirements:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Platforms]
      operationId: getPlatformPublishingRequirements
      summary: Get current provider publication requirements for an account
      responses:
        "200":
          description: Current normalized creator and publication requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingRequirements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /posts:
    parameters:
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Posts]
      operationId: listPosts
      summary: List Posts with ordered attachments and per-Channel outcomes
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PostStatus"
        - $ref: "#/components/parameters/BrandProfileId"
        - name: queue_id
          in: query
          schema:
            type: string
            format: uuid
        - name: queue_assigned_from
          in: query
          description: |
            Inclusive Queue assignment instant. Supply with queue_id and
            queue_assigned_before; the UTC window must not exceed 63 days.
          schema:
            type: string
            format: date-time
        - name: queue_assigned_before
          in: query
          description: |
            Exclusive Queue assignment instant. Supply with queue_id and
            queue_assigned_from; filters immutable membership times, not
            per-Channel delivery or Post creation times.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated Posts in stable identity order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Posts]
      operationId: createPost
      summary: Create a nonempty authoritative draft Post
      description: |
        Creates one durable Post that owns its default content, ordered
        attachments, and saved per-Channel target settings. A draft needs no
        target Channels: the request must carry text or at least one
        attachment so an empty composer never persists an empty Post. Saving
        the same composition again is an updatePost call on the returned id,
        not another createPost.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Draft Post created.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /posts/{post_id}:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/XWorkspaceId"
    get:
      tags: [Posts]
      operationId: getPost
      summary: Get a Post with ordered attachments, targets, and outcomes
      responses:
        "200":
          description: Post.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "304":
          description: Not modified.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Posts]
      operationId: updatePost
      summary: Save the same Post's content, attachments, and target settings
      description: |
        Authoritatively persists the whole draft surface of one Post —
        default text, ordered attachment set, and per-Channel target
        settings — without requiring any target Channel. Attachments may
        reference Assets that are still uploading or processing; readiness
        is required only by schedulePost. The request must name the Post's
        owning Brand Profile and cannot leave the Post empty (no text and no
        attachments); pending attachments keep their ownership while
        asynchronous processing continues. Already-claimed or published
        Distribution outcomes are never rewritten by a save.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Saved Post.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Posts]
      operationId: deletePost
      summary: Soft-delete a Post and release its attachment references
      description: |
        Deletes the Post draft surface and stops publishing its pending
        Distributions. Distribution outcomes already delivered to a Provider
        remain immutable publication history — deleting a Post never
        unpublishes live Channel copies — and referenced Assets stay alive
        while another retained Post, an in-flight processing job, or an
        unfinished attempt still needs them; otherwise each detached Asset
        starts its own orphan grace period.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePostRequest"
      responses:
        "200":
          description: Deleted Post snapshot.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /queues:
    parameters:
