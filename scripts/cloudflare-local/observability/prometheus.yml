# Local-dev Prometheus: scrapes itself and accepts k6 remote-write.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # The Playwright reporter pushes its completed local browser-run snapshot here.
  - job_name: meltiply-frontend-e2e
    scrape_interval: 5s
    static_configs:
      - targets: ["pushgateway:9091"]
